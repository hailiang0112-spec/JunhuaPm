function xlValueSheet(){
  var rows=[['类别','取值','备注']];
  FLOORS.concat([FLOOR_ALL]).forEach(function(f){ rows.push(['楼层', f.name, f.id==='all'? '跨楼层通项' : '']); });
  ROOMS.forEach(function(r){ rows.push(['房间', r.name, floorById(r.fl).name]); });
  rows.push(['房间','本层通用','该事项覆盖整层、不细分房间']);
  BASE_PHASES.forEach(function(p){ rows.push(['施工阶段', p.name, '']); });
  EX_FLOW.forEach(function(s){ rows.push(['补充事项状态', s, '']); });
  return rows;
}
function xlBuildSheets(mode){
  var cur=(mode==='cur');
  var ph=cur? PHASES : BASE_PHASES;
  var prows=[xlHead(XL_PHASE_ROWS)];
  ph.forEach(function(p,i){
    prows.push(XL_PHASE_ROWS.map(function(d){
      switch(d[1]){
        case 'idx':   return String(i+1);
        case 'name':  return p.name||'';
        case 'ps':    return p.start||'';
        case 'pe':    return p.end||'';
        case 'crew':  return p.crew||'';
        case 'w':     return String(Math.round((+p.w||0)*100));
        case 'scope': return p.scope||'';
      }
      return '';
    }));
  });

  var trows=[xlHead(XL_TASK_ROWS)];
  var seq=0;
  function pushTask(p, t){
    seq++;
    trows.push(XL_TASK_ROWS.map(function(d){
      switch(d[1]){
        case 'idx':   return String(seq);
        case 'pname': return p.name||'';
        case 'n':     return t.n||'';
        case 'note':  return t.note||'';
        case 'std':   return t.std||'';
        case 'fl':    return floorById(taskFloor(t)).name;
        case 'rm':    return (t.rm && t.rm!=='all')? roomName(t.rm) : '本层通用';
        case 'plan':  return absDate(p, t.plan)||'';
        case 'act':   return absDate(p, t.act)||'';
        case 'owner': return t.owner||'';
        case 'w':     return String(+t.w||1);
        case 'pct':   return String(+t.pct||0);
      }
      return '';
    }));
  }
  if(cur){ ph.forEach(function(p){ p.tasks.forEach(function(t){ pushTask(p,t); }); }); }
  else {
    /* 空白模板：6 个工段各给 1 行示例 —— 让用户一眼看出「每个工段都要填事项」，
       否则照原样导入后 p2~p6 会没有任何工作事项 */
    BASE_PHASES.forEach(function(bp){
      var t=bp.tasks[0];
      if(!t) return;
      seq++;
      trows.push(XL_TASK_ROWS.map(function(d){
        switch(d[1]){
          case 'idx':   return String(seq);
          case 'pname': return bp.name;
          case 'n':     return t.n;
          case 'note':  return t.note||'';
          case 'std':   return t.std||'';
          case 'fl':    return floorById(taskFloor(t)).name;
          case 'rm':    return (t.rm && t.rm!=='all')? roomName(t.rm) : '本层通用';
          case 'plan':  return absDate(bp, t.plan)||'';
          case 'act':   return '';
          case 'owner': return t.owner||'';
          case 'w':     return String(+t.w||1);
          case 'pct':   return '0';
        }
        return '';
      }));
    });
  }

  var erows=[xlHead(XL_EXTRA_ROWS)];
  var extras = cur? extraList() : [{title:'（示例）三楼卫生间增加浴缸', desc:'业主口头提出，需评估下水改动与楼板承重', date:planYear()+'-09-16', due:planYear()+'-09-20', owner:'张工', st:'处理中'}];
  extras.forEach(function(e,i){
    erows.push(XL_EXTRA_ROWS.map(function(d){
      switch(d[1]){
        case 'idx':   return String(i+1);
        case 'title': return e.title||'';
        case 'desc':  return e.desc||'';
        case 'date':  return e.date||'';
        case 'due':   return e.due||'';
        case 'owner': return e.owner||'';
        case 'st':    return e.st||'待处理';
      }
      return '';
    }));
  });

  function colL(n){ return xlColName(n-1); }
  return [
    { name:'填写说明', rows:xlExplainSheet(mode), widths:[26,20,86], wrapCols:[2], freeze:1 },
    { name:'施工阶段', rows:prows, widths:xlWidths(XL_PHASE_ROWS), textCols:xlTextCols(XL_PHASE_ROWS),
      numCols:xlNumCols(XL_PHASE_ROWS), wrapCols:xlWrapCols(XL_PHASE_ROWS), freeze:1,
      filter:'A1:'+colL(XL_PHASE_ROWS.length)+prows.length },
    { name:'工作事项', rows:trows, widths:xlWidths(XL_TASK_ROWS), textCols:xlTextCols(XL_TASK_ROWS),
      numCols:xlNumCols(XL_TASK_ROWS), wrapCols:xlWrapCols(XL_TASK_ROWS), freeze:1,
      filter:'A1:'+colL(XL_TASK_ROWS.length)+trows.length },
    { name:'补充事项', rows:erows, widths:xlWidths(XL_EXTRA_ROWS), textCols:xlTextCols(XL_EXTRA_ROWS),
      numCols:xlNumCols(XL_EXTRA_ROWS), wrapCols:xlWrapCols(XL_EXTRA_ROWS), freeze:1,
      filter:(erows.length>1? 'A1:'+colL(XL_EXTRA_ROWS.length)+erows.length : '') },
    { name:'取值表',   rows:xlValueSheet(), widths:[16,20,26], freeze:1 }
  ];
}

function onPlanFile(inp){
  var f=inp.files && inp.files[0];
  if(!f) return;
  PLAN_FILE=f.name;
  var nmEl=document.getElementById('planFileName');
  if(nmEl) nmEl.textContent=f.name+'（'+(f.size/1024).toFixed(1)+' KB）';
  var box=document.getElementById('planCheck');
  var btn=document.getElementById('piDo');
  if(btn) btn.disabled=true;
  if(box) box.innerHTML='<div class="pchk wait">正在读取并校验「'+esc(f.name)+'」…</div>';
  var isCsv=/\.csv$/i.test(f.name);
  var p;
  if(isCsv){
    p=f.text().then(function(txt){
      var rows=csvParse(txt);
      return { sheetNames:['工作事项'], sheets:{ '工作事项':rows } };
    });
  } else {
    p=f.arrayBuffer().then(function(buf){ return xlsxRead(buf); });
  }
  p.then(function(wb){
    PLAN_WB=wb;
    PLAN_RESULT=parsePlanSheets(wb);
    renderPlanCheck();
  }).catch(function(e){
    PLAN_RESULT=null;
    if(box) box.innerHTML='<div class="pchk bad"><b>读取失败</b><div class="pi-err">'+esc(e.message||String(e))+'</div>'
      +'<div class="pi-tip">若是 .xls 旧格式，请用 Excel 另存为 .xlsx 或 .csv 后重试。</div></div>';
  });
}

      +'<span>施工阶段 <b>'+(s.hasPhaseSheet? R.phases.length : 6)+'</b> 个'+(s.hasPhaseSheet? '' : '（沿用内置）')+'</span>'
      +'<span>工作事项 <b>'+s.taskCount+'</b> 项</span>'
      +'<span>补充事项 <b>'+s.extraCount+'</b> 条'+(s.hasExtraSheet? '' : '（未提供，将清空）')+'</span>'
      +'</div>'
      +'<div class="pi-phases">'+BASE_PHASES.map(function(b){
           var n=s.byPhase[b.id]||0;
           return '<span class="pip'+(n? '':' zero')+'">'+esc(b.name)+' <b>'+n+'</b></span>';
         }).join('')+'</div>';
    if(R.tasks.length){
      h+='<div class="pi-tip">预览前 5 行（工作事项）：</div>'
        +'<div class="pi-tblwrap"><table class="pi-tbl"><thead><tr><th>阶段</th><th>工作事项</th><th>楼层 / 房间</th><th>计划</th><th>负责人</th><th>权重</th><th>完成度</th></tr></thead><tbody>'
        +R.tasks.slice(0,5).map(function(t){
           var pn=''; BASE_PHASES.forEach(function(b){ if(b.id===t.pid) pn=b.name; });
           var f=floorById(t.rec.fl).name, rm=(t.rec.rm&&t.rec.rm!=='all')? roomName(t.rec.rm) : '本层通用';
           return '<tr><td>'+esc(pn)+'</td><td>'+esc(t.rec.n)+'</td><td>'+esc(f+' · '+rm)+'</td><td>'+esc(t.rec.plan||'—')+'</td>'
                +'<td>'+esc(t.rec.owner)+'</td><td class="num">'+t.rec.w+'</td><td class="num">'+t.rec.pct+'%</td></tr>';
         }).join('')+'</tbody></table></div>';
    }
    if(R.warns.length){
      h+='<div class="pi-tip warn">提醒 '+R.warns.length+' 条：<br>'+R.warns.slice(0,8).map(esc).join('<br>')+'</div>';
    }
  }
  box.innerHTML=h;
  var btn=document.getElementById('piDo');
  if(btn) btn.disabled = R.errors.length>0;
}

/* ---------- 执行导入 ---------- */
function planCollectFilesByName(){
  /* 记录「阶段id|事项名」→ 文件 id，用于导入后按名称重新挂接 */
  var byKey={}, byName={}, dup={};
  PHASES.forEach(function(p){
    p.tasks.forEach(function(t){
      var fs=(t.files||[]).slice();
      if(!fs.length) return;
      byKey[p.id+'|'+String(t.n||'').trim()]=fs;
      var k=String(t.n||'').trim();
      if(byName[k]) dup[k]=1; else byName[k]=fs;
    });
  });
  Object.keys(dup).forEach(function(k){ delete byName[k]; });
  return { byKey:byKey, byName:byName };
}
function doPlanImport(){
  var R=PLAN_RESULT;
  if(!R || R.errors.length){ toast('请先通过校验再导入'); return; }
  var clearOps=!!(document.getElementById('pi_clearops')||{}).checked;
  var doBak  =!(document.getElementById('pi_bak') && !document.getElementById('pi_bak').checked);
  if(doBak){ try{ exportJSON(); }catch(e){} }

  var fileMap=planCollectFilesByName();
  var attached=0;

  /* 1) 阶段：先按表重建，未出现在表里的阶段清掉覆盖（回落到内置） */
  var newPhase={};
  R.phases.forEach(function(o){
    newPhase[o.id]={ name:o.name, start:o.start, end:o.end, crew:o.crew, scope:o.scope };
    if(o.w!=null) newPhase[o.id].w=o.w;
  });
  OVERLAY.phase = R.stats.hasPhaseSheet? newPhase : {};

  /* 2) 工作事项：整段替换（空阶段的也写空数组，确保按表重建） */
  var byPid={};
  BASE_PHASES.forEach(function(b){ byPid[b.id]=[]; });
  R.tasks.forEach(function(t){
    var nm=String(t.rec.n||'').trim();
    var fs=fileMap.byKey[t.pid+'|'+nm] || fileMap.byName[nm] || [];
    if(fs.length) attached++;
    t.rec.files=fs.slice();
    byPid[t.pid].push(t.rec);
  });
  OVERLAY.tasks = byPid;

  /* 3) 补充事项 */
  OVERLAY.extra = R.extras.map(function(e,i){
    return { id:'e'+Date.now().toString(36)+(i<10? '0'+i : i), title:e.title, desc:e.desc,
             date:e.date||TODAY, due:e.due||'', owner:e.owner, st:e.st, files:[] };
  });

  /* 4) 可选的「彻底重置过程数据」 */
  if(clearOps){
    /* 问题台账：内置问题全部标记删除（overlay 语义：内置问题由 delIssues 控制），
       并清空新增问题 / 字段修正 / 闭环记录 */
    var dl={};
    BASE_PHASES.forEach(function(b){ (b.issues||[]).forEach(function(I){ dl[I.id]=true; }); });
    OVERLAY.delIssues=dl;
    OVERLAY.issues=[]; OVERLAY.edit={}; OVERLAY.closed={};
    /* 每日出勤：清空人工登记，自动基线随新工期重算 */
    OVERLAY.att={};
    /* 验收图片：连同内置示意一并清空（[] 为真值，可覆盖内置） */
    BASE_PHASES.forEach(function(b){ OVERLAY.photos[b.id]=[]; });
    /* 计划变更留档 */
    OVERLAY.log=[];
  }

  syncOverlay(); rebuild();
  closeModal();
  go(R.tasks.length? R.tasks[0].pid : (BASE_PHASES[0]||{}).id);
  toast('已按表格重建计划：'+R.stats.taskCount+' 项工作事项 · '+R.extras.length+' 条补充事项'
        + (attached? ' · '+attached+' 项事项的资料已重新挂接' : ''));
}

/* ---------- 入口按钮注入用 ---------- */
function openPlanImportWrap(){ openPlanImport(); }

/* ---------- 8. 初始化 ---------- */
seedArch();          // 补齐档案专区默认分类（需在 rebuild 之前，此时常量已赋值）
rebuild();
render();
/* 旧基线迁移提示：只在确实替换过本机阶段日期时出现一次 */
if(BASE_MIGRATED){ toast('项目周期基线已更新为 '+P_START+' ~ '+P_END+'，已同步本机保存的 '+BASE_MIGRATED+' 个阶段起止日期（其余本机数据保留）'); }
/* 探测本机文件库（IndexedDB）；不可用时自动降级为内存模式并在侧栏提示 */
FS.init(function(){ render(); });
if(typeof document.addEventListener==='function'){
  document.addEventListener('keydown',function(e){ if(e&&e.key==='Escape'){ closeModal(); closePhoto(); } });
}
