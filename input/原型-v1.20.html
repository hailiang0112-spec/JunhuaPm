<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>君华别墅 · 装修项目管理平台</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --line:#e3e8ef; --line2:#eef2f7;
    --tx:#111827; --tx2:#5b6779; --tx3:#94a3b8;
    --brand:#1e5fd0; --brand2:#3b82f6; --brandsoft:#eaf1fe;
    --ok:#15803d; --oksoft:#e8f6ed;
    --warn:#b45309; --warnsoft:#fdf3e3;
    --bad:#c62828; --badsoft:#fdecec;
    --info:#0f766e; --infosoft:#e6f4f2;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--tx); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}

  /* ============ 左侧导航 ============ */
  .side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:18px 18px 16px;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:center}
  .brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#1e5fd0,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
  .brand h1{font-size:17px;font-weight:700;letter-spacing:.2px}
  .brand p{font-size:13px;color:var(--tx3);margin-top:1px}
  .navwrap{flex:1;overflow-y:auto;padding:12px 12px 16px}
  .navgroup{font-size:13px;color:var(--tx3);font-weight:600;letter-spacing:.6px;padding:14px 10px 8px}
  .navitem{display:block;border-radius:9px;padding:10px 12px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;transition:.12s}
  .navitem:hover{background:#f7f9fc}
  .navitem.on{background:var(--brandsoft);border-color:#c9dcfb}
  .navitem .r1{display:flex;align-items:center;gap:8px}
  .navitem .ic{width:25px;height:25px;border-radius:7px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:14.5px;flex:none;color:var(--tx2)}
  .navitem.on .ic{background:var(--brand);color:#fff}
  .navitem .nm{font-weight:600;font-size:15.5px;flex:1}
  .navitem .st{font-size:12.5px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap}
  .st-done{background:var(--oksoft);color:var(--ok)}
  .st-run{background:var(--brandsoft);color:var(--brand)}
  .st-wait{background:#f1f4f8;color:#7b8798}
  .navitem .r2{display:flex;align-items:center;gap:8px;margin-top:7px;padding-left:34px}
  .navitem .track{flex:1;height:5px;border-radius:4px;background:#eaeef4;overflow:hidden}
  .navitem .track i{display:block;height:100%;border-radius:4px;background:var(--brand2)}
  .navitem .pct{font-size:12.5px;color:var(--tx2);font-variant-numeric:tabular-nums;width:38px;text-align:right}
  .sidefoot{padding:14px 15px;border-top:1px solid var(--line2);font-size:14px;color:var(--tx2);background:#fbfcfe}
  .sidefoot .kv{display:flex;justify-content:space-between;padding:3px 0}

  /* ============ 顶栏 ============ */
  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
  .topbar .ptit{font-size:18.5px;font-weight:700}
  .topbar .psub{font-size:14px;color:var(--tx3);margin-top:2px}
  .topbar .spacer{flex:1}
  .btn{border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer;transition:.12s;font-family:inherit;white-space:nowrap}
  .btn:hover{background:#f7f9fc;border-color:#cfd8e3}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#1a53b8}
  .btn.sm{padding:6px 11px;font-size:14px;font-weight:600}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
  .btn.ghost:hover{background:#f2f5f9}
  .view{padding:20px 22px 46px;max-width:1740px}

  /* ============ 通用卡片 ============ */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .card-hd{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line2)}
  .card-hd h2{font-size:17px;font-weight:700;white-space:nowrap}
  .card-hd .desc{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-hd .desc{font-size:14px;color:var(--tx3)}
  .card-hd .spacer{flex:1}
  .card-bd{padding:16px 18px}
  .card-bd.tight{padding:9px 18px 16px}
  .grid{display:grid;gap:16px}
  .g-kpi{grid-template-columns:repeat(6,minmax(0,1fr))}
  .g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g-32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
  @media(max-width:1380px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:1100px){.g-2,.g-3,.g-32{grid-template-columns:minmax(0,1fr)}}

  /* KPI */
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .lb{font-size:14px;color:var(--tx2);display:flex;align-items:center;gap:5px}
  .kpi .vl{font-size:30px;font-weight:750;letter-spacing:-.5px;margin-top:7px;font-variant-numeric:tabular-nums}
  .kpi .vl small{font-size:15px;font-weight:600;color:var(--tx2);margin-left:2px}
  .kpi .sb{font-size:14px;color:var(--tx3);margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tag{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
  .t-ok{background:var(--oksoft);color:var(--ok)}
  .t-warn{background:var(--warnsoft);color:var(--warn)}
  .t-bad{background:var(--badsoft);color:var(--bad)}
  .t-info{background:var(--infosoft);color:var(--info)}
  .t-mute{background:#f1f4f8;color:#7b8798}
  .t-brand{background:var(--brandsoft);color:var(--brand)}
  .up{color:var(--ok);font-weight:700}
  .down{color:var(--bad);font-weight:700}

  /* 表格 */
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{text-align:left;font-size:14px;color:var(--tx2);font-weight:600;background:#fafbfd;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#fafcff}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  .pbar{height:7px;border-radius:6px;background:#eaeef4;overflow:hidden;min-width:72px}
  .pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3b82f6,#1e5fd0)}
  .pbar.g i{background:linear-gradient(90deg,#34a853,#15803d)}
  .pbar.a i{background:linear-gradient(90deg,#f59e0b,#b45309)}
  .pbar.r i{background:linear-gradient(90deg,#ef4444,#b91c1c)}
  .cellbar{display:flex;align-items:center;gap:8px}
  .cellbar .pbar{flex:1;min-width:60px}
  .cellbar span{font-size:14px;color:var(--tx2);width:42px;text-align:right;font-variant-numeric:tabular-nums}
  /* 工作说明列（v1.14）：长文本允许换行，不撑破表格布局 */
  td.tnote{white-space:normal;color:var(--tx2);font-size:14.5px;line-height:1.55}
  td.tnote .tnote-empty{color:#b9c2ce;font-size:13.5px}
  /* 操作列粘性固定：列宽给足（保证日期 / 人名不折行）后表格整体略宽于内容区，
     横向滚动时「编辑 / 删」始终停在最右侧可见 */
  .tasktbl td:last-child{position:sticky;right:0;background:#fff;box-shadow:-8px 0 8px -8px rgba(16,24,40,.14)}
  .tasktbl th:last-child{position:sticky;right:0;background:#fafbfd;box-shadow:-8px 0 8px -8px rgba(16,24,40,.14)}
  .tasktbl tr:hover td:last-child{background:#fafcff}
  /* 完成情况列在事项表内收窄进度条与百分比，给日期 / 说明 / 资料列腾出宽度
     （12 列总宽需落在内容区内，否则触发横向滚动；各数据列的极小宽度之和才是真正的门槛） */
  .tasktbl .pbar{min-width:36px}
  .tasktbl .cellbar span{width:36px}
  /* 事项表内按钮一律不折行：否则「资料 3」会被压成「资 / 3 / 料」两行 */
  .tasktbl .btn{white-space:nowrap}
  .tasktbl .btn.docbtn{padding:5px 9px}
  /* 验收标准（v1.16）：独立字段，以带标签的小块附在「工作说明」单元格内 ——
     不新增列，12 列总宽不变，窄屏适配不受影响 */
  .tn-std{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line2);color:var(--tx2);font-size:13.8px;line-height:1.5}
  .tn-std b{display:inline-block;margin-right:5px;padding:1px 6px;border-radius:5px;background:#eef4ff;color:#1e5fd0;font-size:12.5px;font-weight:700}
  .scroll{max-height:390px;overflow:auto}
  .scroll::-webkit-scrollbar{width:10px;height:10px}
  .scroll::-webkit-scrollbar-thumb{background:#d5dce6;border-radius:8px}

  /* ============ 资料上传 / 房屋档案资料（v1.15） ============ */
  .sp{flex:1}
  .upbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 0 12px}
  .uphint{font-size:13px;color:var(--tx3);line-height:1.5}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(202px,1fr));gap:12px}
  .fcard{border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
  .fcard:hover{border-color:#c9dcfb;box-shadow:var(--shadow)}
  .fthumb{height:118px;background:#f3f6fa;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  .fthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .fthumb .ftile{font-size:15px;font-weight:700;color:#7d8899;letter-spacing:.5px}
  .fmeta{padding:9px 11px 4px}
  .fname{font-size:14.5px;font-weight:600;line-height:1.4;word-break:break-all}
  .fsub{font-size:12.5px;color:var(--tx3);margin-top:3px}
  .fops{display:flex;gap:6px;padding:6px 11px 11px;flex-wrap:wrap}
  .fops .btn.sm{padding:5px 8px}
  .fempty{border:1px dashed #cfd8e3;border-radius:11px;padding:26px;text-align:center;color:var(--tx3);font-size:14.5px;background:#fbfcfe}
  /* ---- 分类文件夹 ---- */
  .foldgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
  .fold{border:1px solid var(--line);border-radius:12px;background:#fff;padding:15px;cursor:pointer;transition:.12s;position:relative}
  .fold:hover{border-color:#c9dcfb;box-shadow:var(--shadow);transform:translateY(-1px)}
  .fold .fh{display:flex;align-items:center;gap:10px}
  .fold .fic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .fold .fnm{font-size:16px;font-weight:700}
  .fold .fct{font-size:13px;color:var(--tx3);margin-top:3px}
  .fold .fops2{position:absolute;top:12px;right:12px;display:flex;gap:5px;opacity:0;transition:.12s}
  .fold:hover .fops2{opacity:1}
  .crumb{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--tx2);margin-bottom:13px;flex-wrap:wrap}
  .crumb span.cb{color:#c3ccd8}
  .crumb a{color:var(--brand);cursor:pointer}
  .crumb a:hover{text-decoration:underline}
  /* ---- 事项表内资料徽标 ---- */
  .fbadge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;margin-left:5px}
  .fbadge.zero{background:#dfe5ee;color:#8a95a5}
  /* ---- 业主公告栏 ---- */
  .nbtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
  .nbtab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:15px;font-weight:600;color:var(--tx2)}
  .nbtab:hover{border-color:#c9dcfb}
  .nbtab.on{background:var(--brandsoft);border-color:#c9dcfb;color:var(--brand)}
  .nbtab b{margin-left:6px}
  .nbcompose{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fbfcfe;margin-bottom:14px}
  .nbmsg{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line2)}
  .nbmsg:last-child{border-bottom:0}
  .nbav{width:34px;height:34px;border-radius:50%;flex:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
  .nbbody{flex:1;min-width:0}
  .nbwho{font-size:14.5px;font-weight:700}
  .nbtime{font-size:12.5px;color:var(--tx3);margin-left:8px;font-weight:400}
  .nbtxt{font-size:15px;line-height:1.65;margin-top:4px;white-space:pre-wrap;word-break:break-word}
  .nbre{background:#f5f8fc;border-left:3px solid #c9dcfb;border-radius:0 9px 9px 0;padding:10px 12px;margin-top:10px}
  /* ---- 补充事项 ---- */
  .excard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:15px 17px;margin-bottom:11px}
  .excard.done{background:#fbfdfb;border-color:#dfeee6}
  .exhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .exno{font-size:12.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
  .extitle{font-size:16.5px;font-weight:700}
  .exdesc{font-size:14.5px;color:var(--tx2);line-height:1.7;margin-top:7px;white-space:pre-wrap}
  .exmeta{font-size:13px;color:var(--tx3);margin-top:9px;display:flex;gap:16px;flex-wrap:wrap}
  .attachrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;align-items:center}
  .achip{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;color:var(--tx2);cursor:pointer}
  .achip:hover{border-color:#c9dcfb;background:#fbfcfe}
  .dbstat{font-size:13px;color:var(--tx3)}
  /* ============ 项目资料录入（v1.16） ============ */
  .pi-note{background:#f7faff;border:1px solid #dbe6f8;border-radius:10px;padding:12px 14px;font-size:14.5px;color:var(--tx2);line-height:1.7}
  .pi-step{display:flex;align-items:center;gap:9px;margin:16px 0 8px;font-size:15.5px}
  .pi-num{width:22px;height:22px;border-radius:50%;background:var(--brandsoft);color:#1e5fd0;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .pi-desc{font-size:13.5px;color:var(--tx3);font-weight:400}
  .pi-btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pi-file{position:relative;overflow:hidden;display:inline-block}
  .pi-file input{position:absolute;left:0;top:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .pi-file span{display:inline-block;padding:8px 14px;border:1px dashed #b9c9e4;border-radius:9px;background:#fbfcfe;font-size:14.5px;font-weight:600;color:#1e5fd0;cursor:pointer}
  .pi-file span:hover{background:#f2f7ff;border-color:#9dbcf0}
  .pi-hint{font-size:13.5px;color:var(--tx3)}
  .pchk{border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.7;border:1px solid}
  .pchk.wait{background:#f8fafc;border-color:var(--line2);color:var(--tx3)}
  .pchk.ok{background:#f2fbf5;border-color:#bfe6cd;color:#14532d}
  .pchk.bad{background:#fff5f5;border-color:#f6c9c9;color:#8f1d1d}
  .pchk.warn{background:#fffaeb;border-color:#f4dfa8;color:#7a4d05}
  .pi-err{margin-top:7px;font-size:13.8px;max-height:190px;overflow:auto;line-height:1.65}
  .pi-tip{margin-top:8px;font-size:13.5px;color:var(--tx3)}
  .pi-tip.warn{color:#8a5a00}
  .pi-sum{display:flex;gap:20px;flex-wrap:wrap;margin-top:8px;font-size:14.5px}
  .pi-sum b{font-size:16px}
  .pi-phases{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .pip{font-size:13.5px;padding:3px 9px;border-radius:999px;background:#eef4ff;color:#1e5fd0;border:1px solid #d3e2fb}
  .pip.zero{background:#f6f7f9;color:#94a3b8;border-color:var(--line2)}
  .pi-tblwrap{margin-top:7px;overflow:auto;border:1px solid var(--line2);border-radius:9px}
  .pi-tbl{width:100%;border-collapse:collapse;font-size:13.8px}
  .pi-tbl th{background:#fafbfd;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2);font-weight:600;white-space:nowrap}
  .pi-tbl td{padding:7px 9px;border-bottom:1px solid var(--line2);color:var(--tx2)}
  .pi-tbl tr:last-child td{border-bottom:none}
  .pi-opts{display:flex;flex-direction:column;gap:8px;font-size:14.5px;color:var(--tx2)}
  .pi-opts label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
  .pi-warn{margin-top:14px;font-size:13.5px;color:#8f1d1d;background:#fff5f5;border:1px solid #f6c9c9;border-radius:9px;padding:9px 12px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  /* 验收标准小块（同 4.10 之前的 .tn-std，此处为资料录入面板内的同名字段样式复用） */

  /* 窄屏（≤1500px）：12 列事项表总宽逼近内容区，收紧侧栏与单元格内边距，
     并把首两列的最小宽下调，尽量让「状态 / 资料 / 操作」一屏可见（不够时仍可横向滚动，操作列已粘性固定） */
  @media (max-width:1500px){
    .app{grid-template-columns:248px minmax(0,1fr)}
    th{padding:9px 9px}
    td{padding:10px 9px}
    .tasktbl .btn{padding:5px 8px;font-size:14px}
    .tasktbl th[style*="min-width:190px"]{min-width:168px !important}
    .tasktbl th[style*="min-width:186px"]{min-width:162px !important}
  }

  /* 更窄屏（≤1400px）：12 列事项表总宽仍超出内容区，此时「操作」列的粘性固定
     会把紧邻的「状态 / 资料」两列盖住（实测 1280 宽下表宽 1097px / 可视区 940px，差 157px）。
     下面把各列宽度成比例下调（内联 width 必须用 !important 覆盖），让整表落回内容区，
     1280 宽下「状态 / 资料 / 操作」三列也能与前面各列同屏可见。
     注意：[style*="width:190px"] 会同时命中「min-width:190px」，故必须加 :last-child 限定。 */
  @media (max-width:1400px){
    /* 单元格内边距收到 6px：12 列共省 48px，是让 1280 宽「状态/资料」不被粘性操作列盖住的关键。
       只作用于 .tasktbl，避免连带影响出勤明细台账 / 说明表等其它表格 */
    .tasktbl th{padding:8px 6px}
    .tasktbl td{padding:9px 6px}
    .tasktbl .btn{padding:4px 7px;font-size:13.5px}
    .tasktbl .btn.docbtn{padding:4px 7px}
    .tasktbl .pbar{min-width:30px}
    .tasktbl .cellbar{gap:6px}
    .tasktbl .cellbar span{width:30px}
    .tasktbl th[style*="width:78px"]{width:60px !important}
    .tasktbl th[style*="min-width:190px"]{min-width:142px !important}
    .tasktbl th[style*="min-width:186px"]{min-width:108px !important}
    .tasktbl th[style*="width:30px"]{width:26px !important}
    .tasktbl th[style*="width:88px"]{width:72px !important}

function roomById(id){
  if(!id) return null;
  if(id==='all') return ROOM_ALL;
  for(var i=0;i<ROOMS.length;i++){ if(ROOMS[i].id===id) return ROOMS[i]; }
  return null;
}
function roomsOfFloor(fid){ return ROOMS.filter(function(r){ return r.fl===fid; }); }
function taskRoom(t){ return (t && t.rm) || ''; }
function roomFloorId(rid){ var r=roomById(rid); return r? r.fl : ''; }
function roomColor(rid){ var r=roomById(rid); return r? floorById(r.fl).color : '#64748b'; }
function roomName(rid){ var r=roomById(rid); return r? r.name : ''; }
function roomFullName(rid){ var r=roomById(rid); return r? (r.id==='all'? '全楼通用' : floorById(r.fl).name+' · '+r.name) : '—'; }
function roomTag(rid){
  var r=roomById(rid);
  if(!r) return '<span class="tag t-mute">—</span>';
  if(r.id==='all') return '<span class="tag" style="background:#64748b1a;color:#64748b">全楼通用</span>';
  var c=floorById(r.fl).color;
  return '<span class="tag" style="background:'+c+'1a;color:'+c+'">'+r.name+'</span>';
}

function dt(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]).getTime();}
function days(a,b){return Math.round((dt(b)-dt(a))/86400000);}
function md(s){return String(s).slice(5);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function sum(a){var t=0;for(var i=0;i<a.length;i++)t+=a[i];return t;}
function week(s){return ['周日','周一','周二','周三','周四','周五','周六'][new Date(dt(s)).getDay()];}
function addDay(s,n){var d=new Date(dt(s)+n*86400000);var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function rndSeed(seed){var s=seed;return function(){s=(s*1103515245+12345)%2147483648;return s/2147483648;};}
function nfmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}

/* 按事项名称匹配工序说明；未命中返回 null */
function taskDocOf(name){
  for(var i=0;i<TASK_DOC.length;i++){
    if(TASK_DOC[i][0].test(name)) return { note:TASK_DOC[i][1], std:TASK_DOC[i][2] };
  }
  return null;
}
/* 一次性合入内置基线：只补空缺，不覆盖已有内容；返回补齐条数 */
function applyTaskDoc(){
  var n=0;
  BASE_PHASES.forEach(function(p){
    (p.tasks||[]).forEach(function(t){
      if(t.note && t.std) return;
      var d=taskDocOf(t.n);
      if(!d) return;
      if(!t.note) t.note=d.note;
      if(!t.std)  t.std=d.std;
      n++;
    });
  });
  return n;
}

function loadOverlay(){
  BASE_MIGRATED=0;                 // 每次加载重新计数（只反映本次是否迁过）
  try{
    var s=localStorage.getItem(LS);
    if(s){
      var o=JSON.parse(s);
      if(o&&typeof o==='object'){
        OVERLAY.phase=o.phase||{}; OVERLAY.tasks=o.tasks||{}; OVERLAY.att=o.att||{};
        OVERLAY.issues=o.issues||[]; OVERLAY.edit=o.edit||{}; OVERLAY.delIssues=o.delIssues||{};
        OVERLAY.closed=o.closed||{}; OVERLAY.photos=o.photos||{}; OVERLAY.log=o.log||[];
        OVERLAY.files=o.files||[]; OVERLAY.folders=o.folders||{}; OVERLAY.extra=o.extra||[];
        OVERLAY.notice=o.notice||[]; OVERLAY.noticeName=o.noticeName||{};
        OVERLAY.base=o.base||'';
        /* 基线迁移：仅当内置时间轴已换代、且本机仍是旧基线时执行一次 */
        if(OVERLAY.base!==BASE_TAG){
          var mv=0;
          Object.keys(OVERLAY.phase||{}).forEach(function(pid){
            var ph=OVERLAY.phase[pid];
            if(!ph) return;
            if(ph.start!==undefined||ph.end!==undefined){
              delete ph.start; delete ph.end; mv++;
              if(!Object.keys(ph).length) delete OVERLAY.phase[pid];
            }
          });
          BASE_MIGRATED=mv;
          OVERLAY.base=BASE_TAG;
          try{ localStorage.setItem(LS, JSON.stringify(OVERLAY)); }catch(e){}
        }
      }
    }
    OVERLAY.upto = s? '已读取本机数据' : '';
  }catch(e){}
}

/* ---------- 3. 数据装配层：基础数据 + 覆盖层 → 运行数据 ---------- */
function rebuild(){ PHASES = BASE_PHASES.map(buildOne); }
function buildOne(bp){
  var o={}, k;
  for(k in bp) o[k]=bp[k];
  var po=OVERLAY.phase[bp.id]||{};
  for(k in po) o[k]=po[k];
  // 工作事项（快照式覆盖）
  var srcT = OVERLAY.tasks[bp.id] || bp.tasks;
  o.tasks = srcT.map(function(t){ var c={}; for(var kk in t) c[kk]=t[kk]; return c; });
  // 每日出勤：生成基线 → 应用人工登记
  o._att = attendanceRaw(o);
  var ov=OVERLAY.att[bp.id]||{}, manual=0;
  o._att.forEach(function(a){ if(Object.prototype.hasOwnProperty.call(ov,a.d)){ a.n=+ov[a.d]; a.manual=true; manual++; } });
  o._manualAtt=manual;
  // 问题：基础（可修正/删除）+ 新增 + 闭环覆盖
  var iss=[];
  bp.issues.forEach(function(I){
    if(OVERLAY.delIssues[I.id]) return;
    var c={}; for(var kk in I) c[kk]=I[kk];
    var e=OVERLAY.edit[I.id]||{}; for(var k2 in e) c[k2]=e[k2];
    iss.push(c);
  });
  OVERLAY.issues.forEach(function(x){
    if(x.pid!==bp.id) return;
    var c={}; for(var kk in x) c[kk]=x[kk];
    var e=OVERLAY.edit[x.id]||{}; for(var k2 in e) c[k2]=e[k2];
    iss.push(c);
  });
  iss.forEach(function(I){
    if(!I.st) I.st='未闭环';
    if(Object.prototype.hasOwnProperty.call(OVERLAY.closed,I.id)){ I.st='已闭环'; I.closed=OVERLAY.closed[I.id]; }
    else if(I.st==='已闭环' && !I.closed){ I.closed=I.d; }
  });
  o.issues=iss;
  // 验收图片（快照式覆盖）
  o.photos = OVERLAY.photos[bp.id] || bp.photos.map(function(x){ return {cap:x[0], st:x[1], src:'', date:bp.end}; });
  // 阶段状态自动推导
  var pr=rawProgress(o);
  o.status = pr>=99.95? '已完成' : pr>0? '进行中' : '未开始';
  return o;
}
function rawProgress(p){
  var tw=0, s=0;
  p.tasks.forEach(function(t){ var w=+t.w||0; tw+=w; s+=w*(+t.pct||0); });
  return tw? s/tw : 0;
}
function phaseProgress(p){ return rawProgress(p); }
function plannedProgress(p, at){
  var a=dt(p.start), b=dt(p.end), t=dt(at||TODAY);
  if(t<=a) return 0; if(t>=b) return 100;
  return (t-a)/(b-a)*100;
}
function byId(pid){ return PHASES.filter(function(x){ return x.id===pid; })[0]; }
function phaseIssues(p){ return p.issues; }
function allIssues(){
  var out=[];
  PHASES.forEach(function(p){ p.issues.forEach(function(I){ I.pid=p.id; I.pname=p.name; out.push(I); }); });
  return out;
}
function issueOverdue(I){
  if(I.st==='已闭环') return 0;
  var d=days(I.due, TODAY); return d>0? d : 0;
}
/* 项目周期 = 各阶段实际起止的最早 / 最晚（v1.17 修复）
   原写法把常量 P_START 拉进来一起取 min()，而常量总是比阶段更早，
   于是「把阶段整体改到 9 月开工」之后，项目周期仍显示 07-06，工期被算成 420 天。
   现在：只要有任何阶段带起止日期，就完全以阶段为准；一个阶段都没有时才用 P_START/P_END 兜底。 */
function projectRange(){
  var s='', e='';
  PHASES.forEach(function(p){
    if(!p.start || !p.end) return;
    if(!s || dt(p.start)<dt(s)) s=p.start;
    if(!e || dt(p.end)>dt(e))   e=p.end;
  });
  if(!s) s=P_START;
  if(!e) e=P_END;
  if(dt(e)<dt(s)) e=s;
  return {s:s, e:e};
}
function attendanceRaw(p){
  var base=({p1:4,p2:6,p3:7,p4:8,p5:5,p6:8})[p.id]||5;
  var r=rndSeed(p.id.charCodeAt(1)*977 + String(p.start).charCodeAt(9)*31);
  var n=days(p.start,p.end), out=[];
  if(!(n>=0) || n>1500) n=0;
  for(var i=0;i<=n;i++){
    var d=addDay(p.start,i), dn=new Date(dt(d)).getDay(), v=0;
    if(dt(d)<=dt(TODAY) && dn!==0){
      v=base + Math.round((r()-0.5)*3);
      if('p3p4'.indexOf(p.id)>=0 && r()>0.75) v+=1;
      if(v<2) v=2;
    }
    out.push({d:d, n:v, rest:dn===0});
  }
  return out;
}
function attendance(p){ return p._att; }
function attendanceTotal(){
  var m={};
  PHASES.forEach(function(p){ p._att.forEach(function(a){ m[a.d]=(m[a.d]||0)+a.n; }); });
  return m;
}
function todayCrew(){ var t=attendanceTotal(); return t[TODAY]||0; }
function manDays(){ var s=0; PHASES.forEach(function(p){ p._att.forEach(function(a){ s+=a.n; }); }); return s; }

function kpi(){
  var sw=0, act=0, pln=0, run=0, done=0, wait=0;
  PHASES.forEach(function(p){
    var w=+p.w||0; sw+=w;
    act += w*phaseProgress(p);
    pln += w*plannedProgress(p);
    if(p.status==='进行中') run++; else if(p.status==='已完成') done++; else wait++;
  });
  if(!sw) sw=1;
  act=act/sw; pln=pln/sw;
  var iss=allIssues(), closed=0, mid=0, open=0, over=0, overSevere=0;
  iss.forEach(function(I){
    if(I.st==='已闭环') closed++; else if(I.st==='处理中') mid++; else open++;
    if(issueOverdue(I)>0){ over++; if(issueOverdue(I)>7) overSevere++; }
  });
  /* 工期按自然日「含首尾」计：2026-09-19 ~ 2027-08-30 = 346 天（days() 返回差值，+1 才含首尾） */
  var R=projectRange(), dur=Math.max(1,days(R.s,R.e)+1);
  return {
    act:act, pln:pln, run:run, done:done, wait:wait,
    total:iss.length, closed:closed, mid:mid, open:open, over:over, overSevere:overSevere,
    legacy: mid+open,
    rate: iss.length? closed/iss.length*100 : 100,
    elapsed: clamp(days(R.s,TODAY)+1,0,dur), dur:dur, range:R,
    tasks: PHASES.reduce(function(a,p){ return a+p.tasks.length; },0),
    crew: todayCrew(), man: manDays()
  };
}

  var R=projectRange(), L=88, X=870, top=52, rh=38;
  var H=top+PHASES.length*rh+34, W=900;
  var span=Math.max(1,days(R.s,R.e)), px=(X-L)/span;
  var xf=function(d){ return L+days(R.s,d)*px; };
  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">';
  var ticks=[[R.s, (new Date(dt(R.s)).getMonth()+1)+'月']];
  var cur=new Date(new Date(dt(R.s)).getFullYear(), new Date(dt(R.s)).getMonth()+1, 1);
  while(cur.getTime()<=dt(R.e)){
    var mm=cur.getMonth()+1, yy=cur.getFullYear();
    ticks.push([yy+'-'+(mm<10?'0':'')+mm+'-01', mm+'月']);
    cur=new Date(yy, mm+1, 1);
  }
  ticks.forEach(function(t){
    var tx=xf(t[0]).toFixed(1);
    s+='<line x1="'+tx+'" y1="'+(top-16)+'" x2="'+tx+'" y2="'+(H-26)+'" stroke="'+GRID+'"/>';
    s+='<text x="'+tx+'" y="'+(top-22)+'" font-size="13" fill="'+AX+'" text-anchor="middle">'+t[1]+'</text>';
  });
  var tx=xf(TODAY);
  s+='<line x1="'+tx.toFixed(1)+'" y1="'+(top-34)+'" x2="'+tx.toFixed(1)+'" y2="'+(H-26)+'" stroke="#c62828" stroke-width="1.4" stroke-dasharray="4 3"/>';
  s+='<text x="'+(tx-5).toFixed(1)+'" y="'+(top-40)+'" font-size="13" fill="#c62828" font-weight="700" text-anchor="end">今日 '+md(TODAY)+'</text>';
  PHASES.forEach(function(p,i){
    var y=top+i*rh, cy=y+rh/2-3;
    var x1=xf(p.start), x2=xf(p.end);
    s+='<text x="8" y="'+(cy+4)+'" font-size="15" font-weight="600" fill="#111827">'+p.name+'</text>';
    s+='<text x="8" y="'+(cy+18)+'" font-size="12" fill="'+AX+'">'+md(p.start)+'~'+md(p.end)+'</text>';
    s+='<rect x="'+x1.toFixed(1)+'" y="'+(cy-6)+'" width="'+Math.max(2,x2-x1).toFixed(1)+'" height="12" rx="6" fill="'+(p.status==='未开始'?'#eef2f7':'#e8ecf3')+'"/>';
    var prog=phaseProgress(p)/100, aEnd=x1+(x2-x1)*prog;
    if(prog>0){
      s+='<rect x="'+x1.toFixed(1)+'" y="'+(cy-6)+'" width="'+(aEnd-x1).toFixed(1)+'" height="12" rx="6" fill="'+p.color+'" opacity="0.92"/>';
      s+='<text x="'+(aEnd+6).toFixed(1)+'" y="'+(cy+4)+'" font-size="12.5" font-weight="700" fill="'+p.color+'">'+Math.round(prog*100)+'%</text>';
    } else {
      s+='<text x="'+(x2+6).toFixed(1)+'" y="'+(cy+4)+'" font-size="12.5" fill="'+AX+'">未开始</text>';
    }
    var pp=plannedProgress(p)/100, mp=x1+(x2-x1)*pp;
    s+='<line x1="'+mp.toFixed(1)+'" y1="'+(cy-9)+'" x2="'+mp.toFixed(1)+'" y2="'+(cy+9)+'" stroke="#1e5fd0" stroke-width="1.6" stroke-dasharray="2 2"/>';
  });
  s+='<text x="8" y="'+(H-8)+'" font-size="13" fill="'+AX+'">实色：实际完成进度　浅色：计划工期　蓝色虚线：计划进度基准　红色虚线：今日</text>';
  s+='</svg>';
  return s;
}

/* ---------- 出勤日历（替代原 30 日堆叠趋势图） ---------- */
function calMonthList(){
  var R=projectRange(), out=[], last=R.e.slice(0,7);
  var y=+R.s.slice(0,4), m=+R.s.slice(5,7);
  while(out.length<36){
    var k=y+'-'+(m<10?'0':'')+m; out.push(k);
    if(k===last) break;
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
function calMonth(){
  var l=calMonthList();
  if(CAL_MONTH && l.indexOf(CAL_MONTH)>=0) return CAL_MONTH;
  var t=TODAY.slice(0,7);
  return l.indexOf(t)>=0? t : l[0];
}
function setCalMonth(v){ CAL_MONTH=v; render(); }
function calShift(n){
  var l=calMonthList(), i=l.indexOf(calMonth())+n;
  if(i<0 || i>=l.length) return;
  CAL_MONTH=l[i]; render();
}
/* 该月日期格子（周一为第一列），null 为占位 */
function calCells(){
  var k=calMonth(), y=+k.slice(0,4), m=+k.slice(5,7);
  var lead=(new Date(y,m-1,1).getDay()+6)%7, last=new Date(y,m,0).getDate();
  var out=[], i;
  for(i=0;i<lead;i++) out.push(null);
  for(i=1;i<=last;i++) out.push(y+'-'+(m<10?'0':'')+m+'-'+(i<10?'0':'')+i);
  while(out.length%7) out.push(null);
  return out;
}
function calLevel(n, isRest){
  if(n<=0) return isRest? 'lv-rest' : 'lv-off';
  if(n<=4)  return 'lv1';
  if(n<=8)  return 'lv2';
  if(n<=12) return 'lv3';
  return 'lv4';
}
function attendanceCalendarHtml(){
  var map=attendanceTotal(), cells=calCells(), k=calMonth();
  var tot=0, days=0, peak=0, peakD='';
  cells.forEach(function(d){
    if(!d) return; var n=map[d]||0;
    if(n>0){ tot+=n; days++; if(n>peak){ peak=n; peakD=d; } }
  });
  var h='<div class="calbar">'
   +'<button class="btn sm" onclick="calShift(-1)" title="上一月">‹ 上月</button>'
   +'<select class="calsel" onchange="setCalMonth(this.value)">'
   +calMonthList().map(function(x){
      return '<option value="'+x+'"'+(x===k?' selected':'')+'>'+x.slice(0,4)+' 年 '+(+x.slice(5,7))+' 月</option>'; }).join('')
   +'</select>'
   +'<button class="btn sm" onclick="calShift(1)" title="下一月">下月 ›</button>'
   +'<div class="spacer"></div>'
   +'<span class="tag t-info">出勤 '+days+' 天</span>'
   +'<span class="tag t-brand">合计 '+tot+' 人·日</span>'
   +'<span class="tag t-mute">日均 '+(days?(tot/days).toFixed(1):'0.0')+' 人</span>'
   +'<span class="tag t-warn">峰值 '+peak+' 人'+(peakD?'　'+md(peakD):'')+'</span>'
   +'</div>';
  h+='<table class="cal"><thead><tr>'
   +['一','二','三','四','五','六','日'].map(function(x,ix){
      return '<th'+(ix>4?' class="wk"':'')+'>周'+x+'</th>'; }).join('')
   +'</tr></thead><tbody>';
  for(var r=0; r<cells.length/7; r++){
    h+='<tr>';
    for(var c=0; c<7; c++){
      var d=cells[r*7+c];
      if(!d){ h+='<td class="cal-c empty"></td>'; continue; }
      var n=map[d]||0, dn=new Date(dt(d)).getDay(), fut=dt(d)>dt(TODAY);
      var cls='cal-c '+calLevel(n, dn===0);
      if(d===TODAY) cls+=' today';
      if(fut) cls+=' future';
      var sub = n>0? (n+' 人') : (dn===0? '休息' : (fut? '' : '无出勤'));
      h+='<td class="'+cls+'" onclick="openModal(\''+d+' 出勤明细\',crewDetailHtml(\''+d+'\'))" title="'+d+' 星期'+week(d)+'">'
       +'<span class="cald">'+(+d.slice(8))+' 日</span>'
       +'<span class="caln">'+sub+'</span></td>';
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  return h;
}

function floorStat(fid){
  var list=[], phW={}, phP={};
  PHASES.forEach(function(p){
    var ts=floorPhaseTasks(p, fid);
    list=list.concat(ts.map(function(t){ return {p:p, t:t}; }));
    phW[p.id]=ts.reduce(function(a,t){ return a+(+t.w||0); },0);
    phP[p.id]=progressOfTasks(ts);
  });
  var iss=0, cl=0;
  allIssues().forEach(function(I){ if(((I.fl)||'all')===fid){ iss++; if(I.st==='已闭环') cl++; } });
  return { id:fid, floor:floorById(fid), list:list, n:list.length,
           done:list.filter(function(x){ return (+x.t.pct||0)>=99.95; }).length,
           pct:progressOfTasks(list.map(function(x){ return x.t; })),
           w:list.reduce(function(a,x){ return a+(+x.t.w||0); },0),
           phW:phW, phP:phP, issues:iss, closed:cl, legacy:iss-cl };
}
function floorStats(){ return floorOpts().map(function(f){ return floorStat(f.id); }); }
function heatColor(v, has){
  if(!has) return ['#f8fafc','#c3cbd6'];
  if(v>=99.95) return ['#1e5fd0','#ffffff'];
  if(v>=90) return ['#60a5fa','#0b2d63'];
  if(v>=70) return ['#93c5fd','#123a72'];
  if(v>=40) return ['#bfdbfe','#123a72'];
  if(v>0) return ['#dbeafe','#123a72'];
  return ['#eef2f7','#8b98a8'];
}
function flTag(fid){

function svgFloorLoad(){
  var rows=floorOpts();

    var segs=PHASES.map(function(p){
      var w=floorPhaseTasks(p,f.id).reduce(function(a,t){ return a+(+t.w||0); },0);
      return {p:p, w:w};
    });
    return {f:f, segs:segs, tot:segs.reduce(function(a,x){ return a+x.w; },0)};
  });
  var gtot=data.reduce(function(a,d){ return a+d.tot; },0)||1;
  var maxv=Math.max.apply(null, data.map(function(d){ return d.tot; }))||1;
  var W=900,H=310,L=54,R=872,T=20,B=H-56;
  var gw=(R-L)/data.length;

  }
  data.forEach(function(d,i){
    var x0=L+i*gw, bw=gw*0.5, x=x0+(gw-bw)/2, acc=0;
    d.segs.forEach(function(sg){
      if(!sg.w) return;
      var h=(B-T)*sg.w/maxv;
      s+='<rect x="'+x.toFixed(1)+'" y="'+(B-acc-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+sg.p.color+'" opacity="0.88"/>';

  return s;

  var W=900,H=300,L=44,R=880,T=22,B=H-52;

  maxv=Math.max(2,Math.ceil(maxv/2)*2);
  var gw=(R-L)/data.length;
  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">';
  for(var g=0;g<=4;g++){
    var y=B-(B-T)*g/4;
    s+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+R+'" y2="'+y.toFixed(1)+'" stroke="'+GRID+'"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" font-size="12.5" fill="'+AX+'" text-anchor="end">'+(maxv*g/4).toFixed(0)+'</text>';
  }
  data.forEach(function(d,i){
    var x0=L+i*gw, bw=gw*0.19, gap=gw*0.045, bx=x0+gw*0.20;
    [['c',d.c,'#15803d'],['m',d.m,'#e08b1a'],['o',d.o,'#c62828']].forEach(function(it,k){
      var h=(B-T)*it[1]/maxv, x=bx+k*(bw+gap);

      if(it[1]>0) s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(B-h-5).toFixed(1)+'" font-size="12.5" font-weight="700" fill="'+it[2]+'" text-anchor="middle">'+it[1]+'</text>';

}

/* ---------- 4.6 房间统计 / 房间图表 / 房间明细 ---------- */
function phaseRoomTasks(p, rid){ return p.tasks.filter(function(t){ return taskRoom(t)===rid; }); }
function roomStat(rid){
  var list=[], phW={}, phP={};
  PHASES.forEach(function(p){
    var ts=phaseRoomTasks(p, rid);
    list=list.concat(ts.map(function(t){ return {p:p, t:t}; }));
    phW[p.id]=ts.reduce(function(a,t){ return a+(+t.w||0); },0);
    phP[p.id]=progressOfTasks(ts);
  });
  var iss=0, cl=0, lg=0;
  allIssues().forEach(function(I){ var r=(I.rm)||''; if(r===rid){ iss++; if(I.st==='已闭环') cl++; else lg++; } });
  var r0=roomById(rid)||ROOM_ALL;
  return { id:rid, room:r0, floor:floorById(r0.fl), list:list, n:list.length,
           done:list.filter(function(x){ return (+x.t.pct||0)>=99.95; }).length,
           pct:progressOfTasks(list.map(function(x){ return x.t; })),
           w:list.reduce(function(a,x){ return a+(+x.t.w||0); },0),
           phW:phW, phP:phP, issues:iss, closed:cl, legacy:lg };
}
function roomStats(){ return ROOMS.map(function(r){ return roomStat(r.id); }); }
function roomStatOfFloor(fid){ return roomsOfFloor(fid).map(function(r){ return roomStat(r.id); }); }
function roomSummary(){
  var st=roomStats(), has=st.filter(function(x){ return x.n>0; });
  return { all:st, has:has, n:st.length, covered:has.length,
           done:has.filter(function(x){ return x.pct>=99.95; }).length,
           pct:progressOfTasks([].concat.apply([], has.map(function(x){ return x.list.map(function(y){ return y.t; }); }))) };
}

    +'<div class="cellbar" style="margin-bottom:7px"><div class="pbar"><i style="width:'+clamp(progressOfTasks(floorPhaseTasks(p,'all')),0,100).toFixed(0)+'%;background:#64748b"></i></div>'
    +'<span>'+progressOfTasks(floorPhaseTasks(p,'all')).toFixed(0)+'%</span></div>'
    +'<div style="font-size:13px;color:#94a3b8">材料进场、隐蔽验收、系统调试等跨楼层通项</div></div>';
  return h+'</div>';
}

   ===================================================================== */
var ARCH_SECS=[

    nav:'业主 / 工地经理 / 设计师' }
];
var ARCH_DEF_FOLDERS=[
  ['ld', ['负一层','夹层','一楼','二楼','三楼','屋顶阳台']],

];
var ARCH_ACCEPT={ ld:'image/*,.pdf', r3:'image/*', ct:'.pdf,.doc,.docx,.xls,.xlsx,image/*' };
var ARCH_NONE='@none';            // 未分类桶

var URL_QUEUED={};                // 已排队的缩略图加载，防重复
var ARCH_OPEN='';                 // 当前进入的分类（'' = 分类总览）
var UP_CTX=null, MODAL_CTX=null;

function archSec(sid){ return ARCH_SECS.filter(function(x){ return x.id===sid; })[0]; }
function seedArch(){

    }

function archFol(sec){ return OVERLAY.folders[sec] || []; }
function folById(sec,fid){ return archFol(sec).filter(function(f){ return f.id===fid; })[0]; }
function folName(sec,fid){ var f=folById(sec,fid); return f? f.name : '未分类'; }
function archFiles(sec,fid){ return (OVERLAY.files||[]).filter(function(f){ return f.sec===sec && (fid==null || f.fo===fid); }); }
function fileById(id){ return (OVERLAY.files||[]).filter(function(f){ return f.id===id; })[0]; }
function filesOf(ids){ return (ids||[]).map(fileById).filter(Boolean); }
function allFileCount(){ return (OVERLAY.files||[]).length; }
function archSecCount(sid){

  if(s.kind==='folder') return archFiles(sid).length;
  if(s.kind==='extra')  return extraList().length;
  return noticeAll().length;
}
function fmtSize(n){
  n=+n||0;
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}
function isImg(f){
  var t=(f&&f.type)||'', n=(f&&f.name)||'';
  return /^image\//.test(t) || /\.(png|jpe?g|gif|webp|bmp|svg|heic)$/i.test(n);
}
function fileExt(f){
  var m=String((f&&f.name)||'').match(/\.([a-z0-9]{1,5})$/i);
  if(m) return m[1].toUpperCase();
  var t=String((f&&f.type)||'').split('/')[1];
  return t? t.slice(0,4).toUpperCase() : 'FILE';

/* ---------- 4.9.1 本机文件库：IndexedDB 优先，不可用时降级内存 ==========
   浏览器安全限制下若拿不到 IndexedDB，功能仍可用，但刷新后需重新上传，
   侧栏与资料弹窗会明确显示当前资料库模式。 */
var FS={ mode:'unk', db:null, mem:{}, urls:{}, ls:{}, ready:false };
FS.init=function(cb){
  function fallback(){ FS.mode='mem'; FS.ready=true; FS.lsRestore(); if(cb) cb(); }
  try{
    if(typeof indexedDB==='undefined' || !indexedDB){ fallback(); return; }
    var rq=indexedDB.open('jh_villa_files',1);
    rq.onupgradeneeded=function(e){
      var d=e.target.result;
      if(d.objectStoreNames.indexOf('blobs')<0) d.createObjectStore('blobs');
    };
    rq.onsuccess=function(e){ FS.db=e.target.result; FS.mode='idb'; FS.ready=true; if(cb) cb(); };
    rq.onerror=fallback;
    rq.onblocked=fallback;
  }catch(e){ fallback(); }
};
FS.put=function(id,blob,cb){
  if(FS.mode==='idb' && FS.db){
    try{
      var tx=FS.db.transaction('blobs','readwrite');
      tx.objectStore('blobs').put(blob,id);
      tx.oncomplete=function(){ if(cb) cb(); };
      tx.onerror=function(){ FS.mem[id]=blob; if(cb) cb(); };
      return;
    }catch(e){}
  }
  FS.mem[id]=blob;
  if(FS.mode==='mem'){ FS.lsPut(id,blob,function(){ if(cb) cb(); }); return; }
  if(cb) cb();
};
/* —— 轻量兜底：浏览器不开放 IndexedDB 时，小文件改存 localStorage（data URL）——
   单文件 ≤1.2MB、总量受浏览器约 5MB 限制；超出者仅存内存，刷新后需重传。 */
FS.lsSlider=1258291;
FS.lsKey=function(id){ return 'jhfile_'+id; };
FS.lsPut=function(id,blob,cb){
  try{
    if(!blob || typeof blob.size!=='number' || blob.size>FS.lsSlider || typeof FileReader!=='function'){ cb(false); return; }
    var fr=new FileReader();
    fr.onload=function(){
      var u=String(fr.result||'');
      if(u){ try{ localStorage.setItem(FS.lsKey(id),u); FS.urls[id]=u; FS.ls[id]=1; }catch(e){} }
      cb(!!u);
    };
    fr.onerror=function(){ cb(false); };
    fr.readAsDataURL(blob);
  }catch(e){ cb(false); }
};
FS.lsRestore=function(){
  var n=0;
  try{
    if(typeof localStorage.key!=='function' || !localStorage.length) return 0;
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && k.indexOf('jhfile_')===0){
        var v=localStorage.getItem(k);
        if(v){ FS.urls[k.slice(7)]=v; FS.ls[k.slice(7)]=1; n++; }
      }
    }
  }catch(e){}
  return n;
};
FS.lsCount=function(){ var n=0,k; for(k in FS.ls) if(FS.ls[k]) n++; return n; };
FS.get=function(id,cb){
  if(FS.mem[id]){ cb(FS.mem[id]); return; }
  if(FS.mode==='idb' && FS.db){
    try{
      var tx=FS.db.transaction('blobs','readonly');
      var g=tx.objectStore('blobs').get(id);
      g.onsuccess=function(){ cb(g.result||null); };
      g.onerror=function(){ cb(null); };
      return;
    }catch(e){}
  }
  cb(null);
};
FS.del=function(id){
  delete FS.mem[id];
  delete FS.ls[id];
  try{ localStorage.removeItem(FS.lsKey(id)); }catch(e){}
  if(FS.urls[id]){ try{ URL.revokeObjectURL(FS.urls[id]); }catch(e){} delete FS.urls[id]; }
  if(FS.mode==='idb' && FS.db){
    try{ FS.db.transaction('blobs','readwrite').objectStore('blobs')['delete'](id); }catch(e){}
  }
};
FS.url=function(id,cb){
  if(FS.urls[id]){ cb(FS.urls[id]); return; }
  FS.get(id,function(b){
    if(!b){ cb(''); return; }
    var u='';
    try{ u=URL.createObjectURL(b); }catch(e){ u=''; }
    if(u) FS.urls[id]=u;
    cb(u);
  });
};
FS.label=function(){
  if(FS.mode==='idb') return 'IndexedDB 本机库';
  if(FS.mode==='mem') return (FS.lsCount()? '兼容模式（' + FS.lsCount() + ' 个已落库）' : '兼容模式');
  return '检测中';
};
FS.durable=function(){ return FS.mode==='idb'; };
/* 批量预热缩略图：加载完成后重绘一次（已排队的 id 不重复入队，失败即止，不会死循环） */
function huntUrls(ids){
  var miss=[];
  (ids||[]).forEach(function(id){ if(id && !FS.urls[id] && !URL_QUEUED[id]){ URL_QUEUED[id]=1; miss.push(id); } });
  if(!miss.length) return;
  var left=miss.length;
  miss.forEach(function(id){
    FS.url(id,function(){
      left--;
      if(left<=0 && typeof setTimeout==='function') setTimeout(function(){ render(); },0);
    });
  });
}

/* ---------- 4.9.2 上传管线 ---------- */
function pickFiles(sec,ref,accept){
  UP_CTX={ sec:sec, ref:ref||'' };
  var inp=document.getElementById('fileIn');
  if(!inp){ toast('当前环境不支持文件选择'); return; }
  try{ inp.accept=accept||''; }catch(e){}
  try{ inp.value=''; }catch(e){}
  if(typeof inp.click==='function') inp.click();
}
function onFilesPicked(ev){
  var inp=(ev&&ev.target)? ev.target : document.getElementById('fileIn');
  var fl=inp&&inp.files? inp.files : null;
  if(!fl||!fl.length) return;
  var ctx=UP_CTX; UP_CTX=null;
  if(!ctx) return;
  var arr=[], i;
  for(i=0;i<fl.length;i++) arr.push(fl[i]);
  storeFiles(ctx,arr);
}
/* 图片超过 1.2MB 时压缩到最长边 1800px（JPEG 0.85），显著减小占用；压缩失败则原样入库 */
function prepareBlob(f,cb){
  if(!isImg(f) || typeof document.createElement!=='function'){ cb(f,0,0); return; }
  var need=(f.size||0) > 1.2*1048576;
  function finish(el,w,h){
    if(!need || !w || !h){ cb(el,w,h); return; }
    try{
      var sc=Math.min(1, 1800/Math.max(w,h));
      var cv=document.createElement('canvas');
      if(!cv || typeof cv.getContext!=='function'){ cb(el,w,h); return; }
      var cx=cv.getContext('2d');
      if(!cx){ cb(el,w,h); return; }
      var cw=Math.round(w*sc), ch=Math.round(h*sc);
      cv.width=cw; cv.height=ch;
      cx.drawImage(el,0,0,cw,ch);
      if(typeof cv.toBlob!=='function'){ cb(el,w,h); return; }
      cv.toBlob(function(b){ cb(b||el, b?cw:w, b?ch:h); },'image/jpeg',0.85);
    }catch(e){ cb(el,w,h); }
  }
  if(typeof createImageBitmap==='function'){
    try{
      createImageBitmap(f).then(function(bm){ finish(bm,bm.width,bm.height); },function(){ cb(f,0,0); });
      return;
    }catch(e){}
  }
  try{
    if(typeof Image!=='function'){ cb(f,0,0); return; }
    var u=URL.createObjectURL(f), im=new Image();
    im.onload=function(){ finish(im,im.naturalWidth||im.width,im.naturalHeight||im.height); };
    im.onerror=function(){ cb(f,0,0); };
    im.src=u;
  }catch(e){ cb(f,0,0); }
}
function storeFiles(ctx,arr){
  if(!FS.ready){ toast('资料库尚未就绪，请稍后重试'); return; }
  var n=arr.length, ok=0, bad=0, i=0;
  if(n>6) toast('正在上传 '+n+' 个文件，请稍候…');
  function step(){
    if(i>=n){ finish(); return; }
    var f=arr[i++];
    if((f.size||0) > MAX_FILE_MB*1048576){ bad++; toast('「'+(f.name||'')+'」超过 '+MAX_FILE_MB+'MB，已跳过'); step(); return; }
    prepareBlob(f,function(blob,w,h){
      var id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      var rec={ id:id, sec:ctx.sec, fo:ctx.ref||'', name:f.name||('资料-'+id),
                type:(blob&&blob.type)||f.type||'', size:(blob&&blob.size)||f.size||0, ts:stampStr(), note:'' };
      if(w&&h){ rec.w=w; rec.h=h; }
      OVERLAY.files.push(rec);
      FS.put(id,blob,function(){
        linkFile(ctx.sec,ctx.ref,id);
        ok++; step();
      });
    });
  }
  function finish(){
    syncOverlay(); rebuild();
    huntUrls((OVERLAY.files||[]).map(function(x){ return x.id; }));
    refreshAfterUpload();
    toast(bad? ('已上传 '+ok+' 个资料，'+bad+' 个被跳过') : ('已上传 '+ok+' 个资料'));
  }
  step();
}
/* 上传 / 删除后刷新：弹窗保持打开（沿用「保存后不关窗」的既有体验） */
function refreshAfterUpload(){
  if(MODAL_CTX && MODAL_CTX.kind==='files'){ render(); openFiles(MODAL_CTX.sec,MODAL_CTX.ref); return; }
  if(MODAL_CTX && MODAL_CTX.kind==='extra'){ render(); openExtraForm(MODAL_CTX.id); return; }
  render();
}
/* 文件与所属对象的绑定：工作事项 / 补充事项在对象上存 id 列表；档案专区靠 rec.sec+fo 归属 */
function ownerFiles(sec,ref){
  if(sec==='task'){
    var a=String(ref||'').split('@'), p=byId(a[0]);
    if(!p) return [];
    var t=p.tasks[+a[1]];
    return t? filesOf(t.files) : [];
  }
  if(sec==='extra'){ var e=extraById(ref); return e? filesOf(e.files) : []; }
  return archFiles(sec, ref);
}
function ownerRefLabel(sec,ref){
  if(sec==='task'){
    var a=String(ref||'').split('@'), p=byId(a[0]);
    if(!p) return '工作事项';
    var t=p.tasks[+a[1]];
    return p.name+' · '+(t? t.n : '工作事项');
  }
  if(sec==='extra'){ var e=extraById(ref); return e? ('补充事项 · '+e.title) : '补充事项'; }
  var s=archSec(sec);
  return (s? s.name : '档案')+' · '+(ref? folName(sec,ref) : '未分类');
}
function linkFile(sec,ref,fid){
  if(sec==='task'){
    var a=String(ref||'').split('@'), pid=a[0], idx=+a[1], p=byId(pid);
    if(!p) return;
    /* 快照式落库：把当前运行态整段写入覆盖层，再追加文件引用 */
    var list=(OVERLAY.tasks[pid] || p.tasks).map(function(t){ var c={}; for(var k in t) c[k]=t[k]; return c; });
    if(!list[idx]) return;
    /* 加上刚入库的记录（此时尚未进 p.tasks，故直接从 OVERLAY.files 取全量引用） */
    var keep=(list[idx].files||[]);
    if(keep.indexOf(fid)<0) keep=keep.concat([fid]);
    list[idx].files=keep;
    OVERLAY.tasks[pid]=list;
    return;
  }
  if(sec==='extra'){
    var e=extraById(ref);
    if(e && (e.files||[]).indexOf(fid)<0) e.files=(e.files||[]).concat([fid]);
    return;
  }
  /* 档案专区无需额外引用 */
}
function doDelFileSilent(id){
  OVERLAY.files=(OVERLAY.files||[]).filter(function(x){ return x.id!==id; });
  FS.del(id);
}

/* ---------- 4.9.3 资料弹窗与文件操作 ---------- */

function fileCardHtml(f){

function openFiles(sec,ref){
  MODAL_CTX={ kind:'files', sec:sec, ref:ref };
  var list=ownerFiles(sec,ref);
  huntUrls(list.map(function(f){ return f.id; }));
  var acc= ARCH_ACCEPT[sec]!==undefined? ARCH_ACCEPT[sec] : 'image/*,.pdf';
  var lbl= (sec==='ct')? '上传合同文件' : (sec==='ld'||sec==='r3'||sec==='task')? '上传图片 / 文件' : '上传附件';
  var h= uploadBarHtml(sec,ref,acc,lbl)
   + (list.length? '<div class="fgrid">'+list.map(fileCardHtml).join('')+'</div>'
                 : '<div class="fempty">还没有上传资料　·　点左上方按钮，可一次选多个文件</div>')
   + '<div class="hint">共 <b>'+list.length+'</b> 个文件　·　归属：<b>'+esc(ownerRefLabel(sec,ref))+'</b><br>'
   + '文件保存在<b>本机浏览器数据库</b>（不联网、不上传）；图片超过 1.2MB 会自动压缩到最长边 1800px 后保存，'
   + '如需保存原画质请另存一份。删除文件不可恢复。'

function openPhotoFile(id){

}
function dlFile(id){
  var f=fileById(id); if(!f){ toast('文件不存在'); return; }
  FS.url(id,function(u){
    if(!u){ toast('文件已不在本机（可能被清理），请重新上传'); return; }
    try{
      var a=document.createElement('a');
      a.href=u; a.download=f.name;
      document.body.appendChild(a); a.click();
      if(typeof a.remove==='function') a.remove();
      toast('已开始下载「'+f.name+'」');
    }catch(e){ toast('下载失败：'+e.message); }
  });
}
function delFile(id){
  var f=fileById(id); if(!f) return;
  MODAL_CTX={ kind:'files', sec:f.sec, ref:f.fo };
  confirmDel('删除资料','确定删除「<b>'+esc(f.name)+'</b>」？该文件会从资料库移除且<b>不可恢复</b>。','doDelFile(\''+id+'\')');
}
function doDelFile(id){
  OVERLAY.files=(OVERLAY.files||[]).filter(function(x){ return x.id!==id; });
  Object.keys(OVERLAY.tasks||{}).forEach(function(pid){
    OVERLAY.tasks[pid]=(OVERLAY.tasks[pid]||[]).map(function(t){
      if(!t.files || t.files.indexOf(id)<0) return t;
      var c={}; for(var k in t) c[k]=t[k];
      c.files=t.files.filter(function(x){ return x!==id; });
      return c;
    });
  });
  (OVERLAY.extra||[]).forEach(function(e){
    if(e.files) e.files=e.files.filter(function(x){ return x!==id; });
  });
  FS.del(id);
  syncOverlay(); rebuild();
  refreshAfterUpload();
  toast('资料已删除');
}

function postNotice(bid){
  var who=gv('nb_who').trim()||nbBoard(bid).who;
  var txt=gv('nb_text').trim();
  if(!txt){ toast('请填写留言内容'); return; }
  OVERLAY.noticeName=OVERLAY.noticeName||{};
  OVERLAY.noticeName[bid]=who;
  noticeAll().push({ id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
                     board:bid, who:who, text:txt, ts:stampStr(), re:'' });
  syncOverlay(); render(); toast('留言已发布');
}
function nbReply(id){
  var m=noticeById(id); if(!m) return;
  var bid=m.board;
  openModal('回复留言',
    '<div style="background:#f5f8fc;border-left:3px solid #c9dcfb;border-radius:0 9px 9px 0;padding:10px 12px;font-size:14.5px;color:#5b6779;line-height:1.65">'
    +'<b>'+esc(m.who||'匿名')+'</b>：'+esc(cutText(m.text||'',140))+'</div>'

    +'</div>',
    '<button class="btn" onclick="closeModal()">取消</button>'

function doReply(id,bid){
  var who=gv('rp_who').trim()||nbBoard(bid).who;
  var txt=gv('rp_text').trim();

  OVERLAY.noticeName=OVERLAY.noticeName||{};

  noticeAll().push({ id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
                     board:bid, who:who, text:txt, ts:stampStr(), re:id });
  syncOverlay(); closeModal(); render(); toast('回复已发布');
}
function delNotice(id){
  var m=noticeById(id); if(!m) return;
  var kids=noticeAll().filter(function(x){ return x.re===id; }).length;
  confirmDel('删除留言','确定删除这条留言？'+(kids? '其 <b>'+kids+'</b> 条回复也会一并删除。':''),
    'doDelNotice(\''+id+'\')');

function doDelNotice(id){
  OVERLAY.notice=noticeAll().filter(function(x){ return x.id!==id && x.re!==id; });
  syncOverlay(); render(); toast('留言已删除');
}
function clearNotice(bid){
  var n=noticeOf(bid).length;
  if(!n){ toast('本板块暂无留言'); return; }
  confirmDel('清空板块','确定清空「<b>'+esc(nbBoard(bid).name)+'</b>」的 <b>'+n+'</b> 条留言？','doClearNotice(\''+bid+'\')');

function doClearNotice(bid){
  OVERLAY.notice=noticeAll().filter(function(x){ return x.board!==bid; });
  syncOverlay(); render(); toast('板块已清空');
}

function phaseTableHtml(){
  var h='<table><thead><tr><th>阶段</th><th>计划开始</th><th>计划结束</th><th>工期</th><th class="num">计划变更</th><th class="num">实际进度</th><th class="num">计划基准</th><th class="num">偏差</th><th class="num">人工日</th><th class="num">问题/闭环</th></tr></thead><tbody>';
  PHASES.forEach(function(p){
    var a=phaseProgress(p), pl=plannedProgress(p), d=a-pl;
    var man=0; attendance(p).forEach(function(x){man+=x.n;});

/* 事项日期还原：给完整 YYYY-MM-DD 直接用；只给 MM-DD 时，在「所属阶段起止区间」内补年份。
   v1.17 修复：原写法固定拼阶段 start 的年份，跨年工程（如 2026-09 开工、2027-08 竣工）里，
   次年 1~8 月的事项会被错补成当年，落回一年前。现在按区间匹配，跨年不会错。 */
function absDate(p,v){
  if(!v) return '';
  v=String(v);
  if(v.length>=10) return v;
  var y=+String(p.start).slice(0,4), st=dt(p.start), en=dt(p.end||p.start);
  var cand=[(y-1)+'-'+v, y+'-'+v, (y+1)+'-'+v];
  for(var i=0;i<cand.length;i++){ var d=dt(cand[i]); if(d>=st && d<=en) return cand[i]; }
  var best=cand[1], bd=Math.abs(dt(cand[1])-st);
  cand.forEach(function(c){ var d=Math.abs(dt(c)-st); if(d<bd){ bd=d; best=c; } });
  return best;
}

      +(od?'<span class="tag t-bad">超期 '+od+' 天</span>':'')
      +'<span class="ops">'
      +'<span style="font-size:14px;color:#94a3b8;align-self:center">'+(I.st==='已闭环'? '闭环耗时 '+cost+' 天':'已挂起 '+cost+' 天')+'</span>'
      +'<button class="btn sm" onclick="openIssueForm(\''+p.id+'\',\''+I.id+'\')">编辑</button>'
      +(I.st==='已闭环'
        ? '<button class="btn sm" onclick="reopenIssue(\''+p.id+'\',\''+I.id+'\')">重新打开</button>'
        : '<button class="btn sm primary" onclick="closeIssue(\''+p.id+'\',\''+I.id+'\')">标记闭环</button>')
      +'<button class="btn sm ghost" onclick="delIssue(\''+p.id+'\',\''+I.id+'\')">删</button>'
      +'</span></div>'
      +'<div class="meta"><span>发现日期：<b>'+I.d+'</b>（'+week(I.d)+'）</span><span>对策负责人：<b>'+I.owner+'</b></span>'
      +'<span>要求闭环：'+I.due+'</span>'+(I.closed?'<span>实际闭环：<b style="color:#15803d">'+I.closed+'</b></span>':'')
      +'<span>等级：'+I.lv+'</span></div>'
      +'<div class="fix"><b>对策方法：</b>'+esc(I.fix)+'</div></div>';
  });
  return h;
}

function svgPhaseAttendance(p){
  var rows=attendance(p), W=900,H=270,L=42,R=880,T=18,B=H-42, maxv=1;
  rows.forEach(function(a){ if(a.n>maxv) maxv=a.n; });
  maxv=Math.max(4,Math.ceil(maxv/2)*2);
  var bw=(R-L)/rows.length, s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">';
  for(var g=0;g<=4;g++){
    var y=B-(B-T)*g/4;
    s+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+R+'" y2="'+y.toFixed(1)+'" stroke="'+GRID+'"/>';
    s+='<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" font-size="12.5" fill="'+AX+'" text-anchor="end">'+Math.round(maxv*g/4)+'</text>';
  }
  var pts=[];
  rows.forEach(function(a,i){
    var x=L+i*bw, h=(B-T)*a.n/maxv;
    if(a.rest) s+='<rect x="'+x.toFixed(1)+'" y="'+T+'" width="'+bw.toFixed(1)+'" height="'+(B-T)+'" fill="#f1f4f8"/>';
    if(a.n) s+='<rect x="'+(x+bw*0.2).toFixed(1)+'" y="'+(B-h).toFixed(1)+'" width="'+(bw*0.6).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+p.color+'" opacity="0.88"/>';
    // 7 日移动平均（仅绘制至今日，避免未来段归零）
    if(dt(a.d)<=dt(TODAY)){
      var w=rows.slice(Math.max(0,i-6),i+1).map(function(z){return z.n;});
      var av=sum(w)/w.length;
      pts.push((x+bw/2).toFixed(1)+','+(B-(B-T)*av/maxv).toFixed(1));
    }
    if(i%3===0) s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(B+16)+'" font-size="12" fill="'+AX+'" text-anchor="middle">'+md(a.d)+'</text>';
    if(a.d===TODAY){
      s+='<line x1="'+(x+bw/2).toFixed(1)+'" y1="'+T+'" x2="'+(x+bw/2).toFixed(1)+'" y2="'+B+'" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3 3"/>';
    }
  });
  s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#1e5fd0" stroke-width="1.8" opacity="0.85"/>';
  s+='<text x="'+L+'" y="'+(H-8)+'" font-size="13" fill="'+AX+'">红色虚线为今日（09-18）</text></svg>';
  return s;
}

/* —— 阶段信息 + 计划变更留档 —— */
var LOG_FIELDS={ start:'计划开始日期', end:'计划结束日期', crew:'负责人 / 班组', w:'阶段权重', scope:'施工范围' };
function logFieldLb(f){ return LOG_FIELDS[f]||f; }
function stampStr(){
  var d=new Date(), z=function(n){ return n<10? '0'+n : ''+n; };
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());
}
function cutText(v,n){ v=String(v==null?'':v); return v.length>n? v.slice(0,n)+'…' : v; }
function dayDiff(a,b){ return Math.round((dt(b)-dt(a))/86400000); }
function allLogs(){ return (OVERLAY && OVERLAY.log) || []; }
function phaseLogs(pid){ return allLogs().filter(function(r){ return r.pid===pid; }); }
function logCount(pid){ return pid? phaseLogs(pid).length : allLogs().length; }
function pushLog(pid, items, note){
  if(!items || !items.length) return null;
  var p=byId(pid);
  OVERLAY.log.unshift({ t:stampStr(), pid:pid, pname:(p&&p.name)||String(pid), note:cutText(note,120), items:items });
  if(OVERLAY.log.length>500) OVERLAY.log.length=500;      // 上限保护本机存储
  return OVERLAY.log[0];
}
/* 计划日期相对内置模板的累计偏移（天） */
function planDrift(pid){
  var bp=null; BASE_PHASES.forEach(function(b){ if(b.id===pid) bp=b; });
  var p=byId(pid); if(!bp||!p) return { s:0, e:0, d:0, n:0 };
  var ds=dayDiff(bp.start,p.start), de=dayDiff(bp.end,p.end);
  return { s:ds, e:de, d:de-ds, n:phaseLogs(pid).length };
}
function ddTag(v){
  if(v==null||v===0) return '<span style="color:#94a3b8">—</span>';
  return v>0? '<b class="down">延后 '+v+' 天</b>' : '<b class="up">提前 '+Math.abs(v)+' 天</b>';
}
function logTableHtml(list, withPhase){
  if(!list.length){
    return '<div class="empty">暂无计划变更留档 —— 每次调整阶段起止日期、负责人、权重或施工范围，都会自动生成一条不可覆盖的记录</div>';
  }
  var h='<div class="scroll"><table><thead><tr>'
   +'<th style="width:122px">记录时间</th>'
   +(withPhase? '<th style="width:84px">阶段</th>' : '')
   +'<th style="width:132px">变更项</th><th style="min-width:250px">变更前 → 变更后</th>'
   +'<th style="width:108px">工期影响</th><th style="width:180px">变更原因 / 备注</th></tr></thead><tbody>';
  list.forEach(function(r){
    var cF=[], cV=[], cD=[];
    (r.items||[]).forEach(function(it){
      cF.push('<span>'+logFieldLb(it.f)+'</span>');
      cV.push('<span><span style="color:#94a3b8">'+esc(it.from)+'</span> <span style="color:#a3aebd">→</span> <b>'+esc(it.to)+'</b></span>');
      cD.push('<span>'+ddTag(it.dd)+'</span>');
    });
    var col=function(a){ return '<div style="display:flex;flex-direction:column;gap:4px">'+a.join('')+'</div>'; };
    h+='<tr><td style="color:#5b6779;white-space:nowrap">'+r.t+'</td>'
      +(withPhase? '<td><b>'+esc(r.pname)+'</b></td>' : '')
      +'<td>'+col(cF)+'</td><td>'+col(cV)+'</td><td>'+col(cD)+'</td>'
      +'<td style="color:#5b6779">'+(r.note? esc(r.note) : '<span style="color:#a3aebd">—</span>')+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function phaseLogCardHtml(pid){
  var list=phaseLogs(pid), n=list.length, d=planDrift(pid);
  var badge= d.d===0? '<span class="tag t-mute">计划日期与初始一致</span>'
           : (d.d>0? '<span class="tag t-bad">工期较初始延后 '+d.d+' 天</span>'

function csvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function exportLogCSV(){
  try{
    var rows=[['记录时间','阶段','变更项','变更前','变更后','工期影响(天)','变更原因备注']];
    allLogs().slice().reverse().forEach(function(r){
      (r.items||[]).forEach(function(it){
        rows.push([ r.t, r.pname, logFieldLb(it.f), it.from, it.to, (it.dd==null? '' : it.dd), r.note ]);
      });
    });
    var csv=rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
    var blob=new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='君华别墅-计划变更留档-'+TODAY+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);

function onPhasePick(){
  var v=gv('f_pid');
  if(v && byId(v)) openPhaseForm(v, true);
}
function savePhase(pid){
  var p0=byId(pid);
  var st=gv('f_start'), en=gv('f_end'), w=+gv('f_w');
  if(!st||!en){ toast('请填写完整的起止日期'); return; }
  if(dt(st)>dt(en)){ toast('开始日期不能晚于结束日期'); return; }
  var crew=gv('f_crew').trim(), scope=gv('f_scope').trim(), note=gv('f_note').trim();
  var nw=(w>0? w/100 : 0.1);
  /* —— 逐字段比对，只有真正变化的才留档 —— */
  var items=[];
  if(st!==p0.start)        items.push({ f:'start', from:p0.start, to:st, dd:dayDiff(p0.start, st) });
  if(en!==p0.end)          items.push({ f:'end',   from:p0.end,   to:en, dd:dayDiff(p0.end, en) });
  if(crew!==(p0.crew||'')) items.push({ f:'crew',  from:cutText(p0.crew||'（空）',30), to:cutText(crew||'（空）',30), dd:null });
  if(Math.abs(nw-(+p0.w||0.1))>1e-9)
    items.push({ f:'w', from:Math.round((+p0.w||0.1)*100)+'%', to:Math.round(nw*100)+'%', dd:null });
  if(scope!==(p0.scope||'')) items.push({ f:'scope', from:cutText(p0.scope||'（空）',30), to:cutText(scope||'（空）',30), dd:null });
  OVERLAY.phase[pid]={ start:st, end:en, crew:crew, scope:scope, w:nw };
  pushLog(pid, items, note);
  var nm=p0.name, jump=(FORM_BASE && FORM_BASE!==pid);
  /* v1.12：保存后弹窗不关闭 —— 重建数据 + 刷新表单，可接着切下一个工段继续改（一个弹窗改完整套）。
     若在标题栏换过工段，后台页面同步跳到该工段页，关掉弹窗看到的就是那一页。 */
  syncOverlay(); rebuild();
  if(jump) go(pid); else render();
  openPhaseForm(pid, true);
  toast(items.length? ('「'+nm+'」计划已保存，本次 '+items.length+' 项变更已留档 · 可继续在上方切换工段')
                    : ('「'+nm+'」阶段信息已保存，无字段变化 · 可继续在上方切换工段'));
}

function saveIssue(iid){
  var t=gv('f_t').trim();
  if(!t){ toast('请填写问题描述'); return; }
  var pid=gv('f_pid'), st=gv('f_st');
  var fl=gv('f_fl')||'all';
  var rm=gv('f_rm'); if(fl==='all') rm='all';
  if(rm && rm!=='all' && roomFloorId(rm)!==fl){ toast('房间与楼层不匹配，请重新选择'); return; }
  var rec={ t:t, d:gv('f_d')||TODAY, lv:gv('f_lv'), fl:fl, rm:rm, st:(st||'未闭环'), fix:gv('f_fix').trim()||'待补充对策',
            owner:gv('f_o').trim()||'待指派', due:gv('f_due')||addDay(TODAY,7) };
  var isNew=false;
  for(var i=0;i<OVERLAY.issues.length;i++){
    if(OVERLAY.issues[i].id===iid){ isNew=true; OVERLAY.issues[i].pid=pid; for(var k in rec) OVERLAY.issues[i][k]=rec[k]; }
  }
  if(!iid){
    rec.id='N'+String(Date.now()).slice(-6); rec.pid=pid;
    OVERLAY.issues.push(rec); iid=rec.id;
  } else if(!isNew){
    if(!OVERLAY.edit[iid]) OVERLAY.edit[iid]={};
    for(var k2 in rec) OVERLAY.edit[iid][k2]=rec[k2];
  }
  if(st==='已闭环'){ if(!OVERLAY.closed[iid]) OVERLAY.closed[iid]=TODAY; } else { delete OVERLAY.closed[iid]; }
  afterEdit(iid? '问题 '+iid+' 已保存，汇总已重算' : '已登记新问题，汇总已重算');
}

function compressImg(file, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var raw=fr.result;
    try{
      var img=new Image();
      img.onload=function(){
        try{
          var max=1280, w=img.width, hh=img.height;
          if(w>max){ hh=Math.round(hh*max/w); w=max; }
          var cv=document.createElement('canvas');
          cv.width=w; cv.height=hh;
          cv.getContext('2d').drawImage(img,0,0,w,hh);
          cb(cv.toDataURL('image/jpeg',0.72));
        }catch(e){ cb(raw); }
      };
      img.onerror=function(){ cb(raw); };
      img.src=raw;
    }catch(e){ cb(raw); }
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}

function importJSON(el){
  var f= el && el.files && el.files[0];
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(fr.result);
      OVERLAY={ phase:o.phase||{}, tasks:o.tasks||{}, att:o.att||{}, issues:o.issues||[],
                edit:o.edit||{}, delIssues:o.delIssues||{}, closed:o.closed||{}, photos:o.photos||{}, upto:'', log:o.log||[],
                files:o.files||[], folders:o.folders||{}, extra:o.extra||[], notice:o.notice||[], noticeName:o.noticeName||{} };
      seedArch();
      syncOverlay(); rebuild(); closeModal(); render();
      toast('已导入备份数据，汇总已重算（文件本体需在原机使用）');
    }catch(e){ toast('导入失败：文件格式不正确'); }
  };
  fr.readAsText(f);
}

    x += '<cols>' + o.widths.map(function(w,i){

  }

  }
  var mv = /<v>([\s\S]*?)<\/v>/.exec(inner);
  raw = mv? xmlUnesc(mv[1]) : '';
  if(t==='s') return { v: (shared[+raw] || ''), dv: null };
  var num = parseFloat(raw);
  if(isFinite(num)) return { v: raw, dv: xlSerialDate(num) };
  return { v: raw, dv: null };
}
function xlSheetRows(xml, shared){
  var rows=[], rr=/<row[^>]*>([\s\S]*?)<\/row>/g, m;
  while((m=rr.exec(xml))){
    var cells=[], i=0, cr=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, cm;
    while((cm=cr.exec(m[1]))){
      var attrs=cm[1]||'', inner=cm[2]||'';
      var mr=/r="([A-Z]+)\d+"/.exec(attrs);
      var ci = mr? xlColIdx(mr[1]) : i;
      cells[ci] = xlCellVal(attrs, inner, shared);
      i = ci + 1;
    }
    for(var k=0;k<cells.length;k++) if(cells[k]===undefined) cells[k] = { v:'', dv:null };
    rows.push(cells);
  }
  return rows;
}
/* 读 xlsx：返回 { sheetNames:[], sheets:{ 名称: rows } }（rows 为 {v,dv} 二维数组） */
function xlsxRead(buf){
  var u8 = new Uint8Array(buf);
  var list = zipList(u8);
  if(!list) return Promise.reject(new Error('不是有效的 xlsx（未找到 ZIP 结构）；若为 .xls 旧格式，请另存为 .xlsx 或 .csv'));
  var map={}, i;
  for(i=0;i<list.length;i++) map[list[i].name] = list[i];
  function getText(name){
    var e = map[name];
    if(!e) return Promise.resolve('');
    var d = zipData(u8, e);
    if(e.method===0) return Promise.resolve(utf8Decode(d));
    return inflateRaw(d).then(function(r){ return utf8Decode(r); });
  }
  return getText('xl/workbook.xml').then(function(wbx){
    if(!wbx) throw new Error('xlsx 内缺少 xl/workbook.xml，文件可能已损坏');
    var names=[], re=/<sheet\b[^>]*name="([^"]*)"[^>]*r:id="([^"]*)"/g, m;
    while((m=re.exec(wbx))) names.push({ name: xmlUnesc(m[1]), rid: m[2] });
    if(!names.length){
      var re2=/<sheet\b[^>]*r:id="([^"]*)"[^>]*name="([^"]*)"/g;
      while((m=re2.exec(wbx))) names.push({ name: xmlUnesc(m[2]), rid: m[1] });
    }
    return getText('xl/_rels/workbook.xml.rels').then(function(rx){
      var rel={}, rr=/<Relationship\b[^>]*Id="([^"]*)"[^>]*Target="([^"]*)"/g, rm;
      while((rm=rr.exec(rx))) rel[rm[1]] = rm[2];
      return getText('xl/sharedStrings.xml').then(function(ssx){
        var shared = ssx? xlSharedStrings(ssx) : [];
        var jobs = names.map(function(nm, idx){
          var tgt = rel[nm.rid] || ('worksheets/sheet'+(idx+1)+'.xml');
          if(tgt.charAt(0)==='/') tgt = tgt.slice(1);
          if(tgt.indexOf('xl/')!==0) tgt = 'xl/' + tgt;
          return getText(tgt).then(function(sx){ return { name: nm.name, rows: xlSheetRows(sx, shared) }; });
        });
        return Promise.all(jobs).then(function(arr){
          var sheets={}, order=[];
          arr.forEach(function(a){ sheets[a.name]=a.rows; order.push(a.name); });
          return { sheetNames: order, sheets: sheets };
        });
      });
    });
  });
}
/* ---------- CSV 读取（单表兜底通道） ---------- */
function csvParse(text){
  text = String(text||'').replace(/^\uFEFF/, '');
  var rows=[], row=[], cur='', q=false, i=0;
  while(i<text.length){
    var ch = text.charAt(i);
    if(q){
      if(ch==='"'){ if(text.charAt(i+1)==='"'){ cur+='"'; i+=2; continue; } q=false; i++; continue; }
      cur += ch; i++; continue;
    }
    if(ch==='"'){ q=true; i++; continue; }
    if(ch===','){ row.push(cur); cur=''; i++; continue; }
    if(ch==='\r'){ i++; continue; }
    if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; i++; continue; }
    cur += ch; i++;
  }
  row.push(cur); rows.push(row);
  function blank(r){ return !r || r.every(function(c){ return String(c).trim()===''; }); }
  while(rows.length && blank(rows[rows.length-1])) rows.pop();
  return rows.map(function(r){ return r.map(function(c){ return { v:String(c).trim(), dv:null }; }); });
}
/* ---------- 通用工具 ---------- */
function normDate(cell){
  if(!cell) return '';
  if(cell.dv) return cell.dv;
  var raw = String(cell.v||'').trim();
  if(!raw) return '';
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(raw)){
    var p=raw.split('-'); return p[0]+'-'+('0'+p[1]).slice(-2)+'-'+('0'+p[2]).slice(-2);
  }
  var m = raw.match(/^(\d{4})[\/\.年](\d{1,2})[\/\.月](\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m = raw.match(/^(\d{1,2})[\/\.月-](\d{1,2})日?$/);
  if(m) return '0000-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);
  var n = parseFloat(raw);
  if(isFinite(n) && String(n)===raw){ var d=xlSerialDate(n); if(d) return d; }
  return '';
}
function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 1200);
}

/* ---------- 归一化：表头 / 名称匹配 ---------- */
function xlNorm(s){
  return String(s==null?'':s).replace(/[\s\u3000]/g,'')
    .replace(/（/g,'(').replace(/）/g,')').replace(/：/g,':')
    .replace(/[／]/g,'/').replace(/[－—]/g,'-');
}
function planPhaseKey(s){
  return xlNorm(s).replace(/(阶段|工段|工序)$/,'');
}
function planPhaseId(s){
  var k=planPhaseKey(s), i;
  if(!k) return null;
  for(i=0;i<BASE_PHASES.length;i++){ if(planPhaseKey(BASE_PHASES[i].name)===k) return BASE_PHASES[i].id; }
  /* v1.20：阶段名可以在软件里或 Excel 里改过，当前运行数据同样参与匹配，
     这样「导出 → 改名 → 导回」的往返不会因为名字变了而失效 */
  for(i=0;i<PHASES.length;i++){ if(PHASES[i] && planPhaseKey(PHASES[i].name)===k) return PHASES[i].id; }
  return null;
}
function planFloorId(s){
  var k=xlNorm(s);
  if(!k) return 'all';
  if(/^(全楼通用|通用|全部|跨楼层|全楼)$/.test(k)) return 'all';
  for(var i=0;i<FLOORS.length;i++){
    var f=FLOORS[i];
    if(xlNorm(f.name)===k || f.id===k.toLowerCase() || xlNorm(f.short)===k) return f.id;
  }
  return null;
}
function planRoomId(s, flId){
  var k=xlNorm(s);
  if(!k) return (flId==='all')? 'all' : '';
  if(/^(本层通用|通用|整层|全层)$/.test(k)) return 'all';
  /* 房间名可能跨楼层重名（本项目「电梯间」在夹层/一楼/二楼/三楼各有一个），
     必须按「楼层 + 房间名」双条件定位，不能取第一个同名房间 */
  var hits=[], i;
  for(i=0;i<ROOMS.length;i++){ if(xlNorm(ROOMS[i].name)===k) hits.push(ROOMS[i]); }
  if(!hits.length) return null;
  if(flId && flId!=='all'){
    for(i=0;i<hits.length;i++){ if(hits[i].fl===flId) return hits[i].id; }
    return { conflict:hits[0] };
  }
  if(hits.length===1) return hits[0].id;
  return { ambiguous:hits.map(function(r){ return floorById(r.fl).name+' / '+r.name; }).join('、') };
}
function planYear(){ return String(BASE_PHASES[0].start).slice(0,4); }
function planFixDate(d){       /* '0000-MM-DD'（只给了月日）→ 按项目年份补全 */
  if(!d) return '';

  return d;
}
function planTaskDate(d){      /* 事项日期只给月日时保留 MM-DD，交给 absDate() 按所属阶段年份补全 */

function planDateOrder(a, b, msg, err){

/* ---------- 表头定位（按表头文字识别列，列顺序可自由调整） ---------- */
function xlFindCol(head, names){
  for(var i=0;i<head.length;i++){
    var t=xlNorm(head[i]&&head[i].v);
    for(var j=0;j<names.length;j++){ if(t===xlNorm(names[j])) return i; }
  }

}
function xlCell(row, i){ return (i>=0 && row && row[i])? row[i] : {v:'',dv:null}; }
function xlStr(row, i){ return String(xlCell(row,i).v||'').trim(); }
function xlNum(row, i){
  var raw=xlStr(row,i).replace(/[^\d.\-]/g,'');
  if(!raw) return NaN;
  var n=parseFloat(raw);

}
function xlRowBlank(row){
  if(!row) return true;
  for(var i=0;i<row.length;i++){ if(String((row[i]&&row[i].v)||'').trim()!=='') return false; }
  return true;
}

/* ---------- 工作表分类（按表名 + 表头文字双识别，CSV 单表也能认出来） ---------- */
function planClassify(wb){
  var out={ phase:null, task:null, extra:null, explain:null, values:null };
  (wb.sheetNames||[]).forEach(function(nm){
    var rows=wb.sheets[nm];
    if(!rows || !rows.length) return;
    var head=rows[0].map(function(c){ return xlNorm(c&&c.v); });
    if(head.indexOf('阶段名称')>=0 || (head.indexOf('阶段')>=0 && head.indexOf('计划开始日期')>=0)){ out.phase=rows; return; }
    if(head.indexOf('工作事项名称')>=0){ out.task=rows; return; }
    if(head.indexOf('事项标题')>=0){ out.extra=rows; return; }
    if(xlNorm(nm).indexOf('取值')>=0){ out.values=rows; return; }
    if(xlNorm(nm).indexOf('说明')>=0){ out.explain=rows; return; }
  });
  return out;
}

/* ---------- 核心：解析 + 校验（同步纯函数，便于沙箱断言） ---------- */
function parsePlanSheets(wb){
  var res={ phases:[], tasks:[], extras:[], errors:[], warns:[], stats:{} };
  var errs=res.errors, warns=res.warns;
  function E(m){ if(errs.length<60) errs.push(m); }
  function W(m){ if(warns.length<60) warns.push(m); }
  var cls=planClassify(wb);

  /* ---- 施工阶段 ---- */
  var pidOf={}, alias={};        /* alias：阶段表里用户填的名称 / 序号 → 内置工段 id */
  if(cls.phase){
    var ph=cls.phase, h=ph[0];
    var cName=xlFindCol(h,['阶段名称','阶段','名称']);
    var cPs  =xlFindCol(h,['计划开始日期','开始日期','计划开始','开始']);
    var cPe  =xlFindCol(h,['计划结束日期','结束日期','计划结束','结束']);
    var cCrew=xlFindCol(h,['施工班组/负责人','施工班组','班组/负责人','负责人','班组']);
    var cW   =xlFindCol(h,['阶段权重(%)','阶段权重','权重(%)','权重']);
    var cSc  =xlFindCol(h,['施工范围说明','施工范围','范围','说明']);
    if(cName<0) E('「施工阶段」表缺少「阶段名称」列');
    else for(var i=1;i<ph.length;i++){
      if(xlRowBlank(ph[i])) continue;
      var nm=xlStr(ph[i],cName);
      if(!nm) continue;
      var pid=planPhaseId(nm), byRow=(i>=1 && i<=BASE_PHASES.length)? BASE_PHASES[i-1].id : null;
      if(!pid){
        /* 名称改成了自定义名称：按「行序」对应内置工段（本表固定 6 行，与内置顺序一致） */
        if(byRow && !pidOf[byRow]){
          pid=byRow;
          W('施工阶段 第 '+(i+1)+' 行：「'+nm+'」不是内置工段名，已按行序对应内置「'+byRow+'」工段（阶段名称将以本表为准）');
        } else {
          E('施工阶段 第 '+(i+1)+' 行：阶段名称「'+nm+'」无法匹配到内置 6 个工段（本版本不支持增删阶段，请改名或删掉该行）');
          continue;
        }
      }
      if(pidOf[pid]){ E('施工阶段 第 '+(i+1)+' 行：「'+nm+'」重复出现'); continue; }
      alias[xlNorm(nm)]=pid;
      var base=null; BASE_PHASES.forEach(function(b){ if(b.id===pid) base=b; });
      var o={ id:pid, name:nm };
      var ps=planFixDate(normDate(xlCell(ph[i],cPs))), pe=planFixDate(normDate(xlCell(ph[i],cPe)));
      if(cPs>=0 && xlStr(ph[i],cPs) && !ps) E('施工阶段 第 '+(i+1)+' 行：计划开始日期无法识别「'+xlStr(ph[i],cPs)+'」');
      if(cPe>=0 && xlStr(ph[i],cPe) && !pe) E('施工阶段 第 '+(i+1)+' 行：计划结束日期无法识别「'+xlStr(ph[i],cPe)+'」');
      if(ps && pe && ps>pe) E('施工阶段 第 '+(i+1)+' 行：开始日期晚于结束日期');
      /* 起止日期是甘特图与出勤台账的基准，空值一律沿用内置值；班组 / 范围允许清空 */
      o.start = ps || base.start;
      o.end   = pe || base.end;
      o.crew  = cCrew>=0? xlStr(ph[i],cCrew) : base.crew;
      o.scope = cSc>=0?   xlStr(ph[i],cSc)  : base.scope;
      var pw=xlNum(ph[i],cW);
      if(isFinite(pw)){ if(pw<1||pw>100) E('施工阶段 第 '+(i+1)+' 行：阶段权重应填 1-100 的整数'); else o.w=Math.round(pw)/100; }
      pidOf[pid]={ rec:o, row:i+1 };
      res.phases.push(o);
    }
    BASE_PHASES.forEach(function(b){
      if(!pidOf[b.id]) W('「'+b.name+'」阶段未出现在阶段表中，将沿用软件内置计划');
    });
  } else {
    W('未找到「施工阶段」表，6 个阶段的计划字段沿用软件内置值（只重建工作事项）');
  }

  /* ---- 工作事项 ---- */
  var order=[];
  if(cls.task){
    var th=cls.task, ht=th[0];
    var tPn  =xlFindCol(ht,['施工阶段','阶段','所属阶段']);
    var tN   =xlFindCol(ht,['工作事项名称','工作事项','事项名称','事项']);
    var tNote=xlFindCol(ht,['工作说明','说明']);
    var tStd =xlFindCol(ht,['验收标准','标准','验收']);
    var tFl  =xlFindCol(ht,['所属楼层','楼层']);
    var tRm  =xlFindCol(ht,['所属房间/区域','所属房间','房间/区域','房间']);
    var tPlan=xlFindCol(ht,['计划完成日期','计划日期','计划']);
    var tAct =xlFindCol(ht,['实际完成日期','实际日期','实际']);
    var tOwn =xlFindCol(ht,['负责人','责任人']);
    var tW   =xlFindCol(ht,['权重(1-5)','权重']);
    var tPct =xlFindCol(ht,['完成度(%)','完成度','完成率(%)','完成率']);
    var tIdx =xlFindCol(ht,['序号','编号']);
    if(tN<0) E('「工作事项」表缺少「工作事项名称」列');
    else for(var r=1;r<th.length;r++){
      if(xlRowBlank(th[r])) continue;
      var rn=xlStr(th[r],tN);
      if(!rn){ E('工作事项 第 '+(r+1)+' 行：工作事项名称为空'); continue; }
      var pid2=null;
      if(tPn<0) pid2=BASE_PHASES[0].id;
      else {
        var pv=xlStr(th[r],tPn), pk=xlNorm(pv);
        pid2=planPhaseId(pv)||alias[pk]||null;
        /* 允许直接填 1~6（按「施工阶段」表的行序） */
        if(!pid2 && /^[1-6]$/.test(pk)){ var br=res.phases[+pk-1]; if(br) pid2=br.id; }
        if(!pid2){
          E('工作事项 第 '+(r+1)+' 行：施工阶段「'+pv+'」无法匹配到 6 个工段之一（可填工段名或序号 1~6）');
          continue;
        }
      }
      var fl=xlStr(th[r],tFl), rmRaw=xlStr(th[r],tRm), fId=null, rId='';
      /* 房间列允许写成「负一楼/车库」，此时楼层信息从这里取 */
      if(rmRaw.indexOf('/')>=0){
        var parts=rmRaw.split('/');
        if(!fl && parts.length===2) fl=parts[0];
        rmRaw=parts.length===2? parts[1] : rmRaw;
      }
      fId=planFloorId(fl);
      if(fId===null){ E('工作事项 第 '+(r+1)+' 行：所属楼层「'+fl+'」不在取值表内'); continue; }
      /* 只填了房间名、没填楼层：尝试从房间名反推楼层；重名房间（如「电梯间」）会抛错要求补楼层 */
      if(fId==='all' && rmRaw && !/^(本层通用|通用|整层|全层)$/.test(xlNorm(rmRaw))){
        var cand=planRoomId(rmRaw, '');
        if(cand===null){ E('工作事项 第 '+(r+1)+' 行：所属房间「'+rmRaw+'」不在取值表内'); continue; }
        if(cand && cand.ambiguous){ E('工作事项 第 '+(r+1)+' 行：房间「'+rmRaw+'」在多个楼层重名（'+cand.ambiguous+'），请同时填写「所属楼层」'); continue; }
        if(cand && cand!=='all'){ fId=roomFloorId(cand); }
      }
      if(fId==='all') rId='all';
      else {
        var rr=planRoomId(rmRaw, fId);
        if(rr===null){ E('工作事项 第 '+(r+1)+' 行：所属房间「'+rmRaw+'」不在取值表内'); continue; }
        if(rr && rr.conflict){ E('工作事项 第 '+(r+1)+' 行：房间「'+rmRaw+'」属于「'+floorById(rr.conflict.fl).name+'」，与所选楼层「'+floorById(fId).name+'」不一致'); continue; }
        if(rr && rr.ambiguous){ E('工作事项 第 '+(r+1)+' 行：房间「'+rmRaw+'」在多个楼层重名（'+rr.ambiguous+'），请同时填写「所属楼层」'); continue; }
        rId=rr;
        if(!rId) rId='all';
      }
      var plan=planTaskDate(normDate(xlCell(th[r],tPlan))), act=planTaskDate(normDate(xlCell(th[r],tAct)));
      if(tPlan>=0 && xlStr(th[r],tPlan) && !plan) E('工作事项 第 '+(r+1)+' 行：计划完成日期无法识别「'+xlStr(th[r],tPlan)+'」');
      if(tAct>=0 && xlStr(th[r],tAct) && !act) E('工作事项 第 '+(r+1)+' 行：实际完成日期无法识别「'+xlStr(th[r],tAct)+'」');
      var tw=xlNum(th[r],tW), tp=xlNum(th[r],tPct);
      if(isFinite(tw) && (tw<1||tw>5)) E('工作事项 第 '+(r+1)+' 行：权重应填 1-5 的整数');
      if(isFinite(tp) && (tp<0||tp>100)) E('工作事项 第 '+(r+1)+' 行：完成度应填 0-100');
      var pct = isFinite(tp)? Math.round(tp) : (act? 100 : 0);
      var rec2={ n:rn, note:xlStr(th[r],tNote), std:xlStr(th[r],tStd),
                 plan:plan||'', act:act||'', owner:xlStr(th[r],tOwn)||'待指派',
                 fl:fId, rm:rId, w:isFinite(tw)? Math.round(tw):2, pct:pct, files:[] };
      res.tasks.push({ pid:pid2, row:r+1, rec:rec2 });
      if(order.indexOf(pid2)<0) order.push(pid2);
    }
    if(!res.tasks.length) E('「工作事项」表没有任何有效数据行');
  } else {
    E('未找到「工作事项」表（表头需含「工作事项名称」列）');
  }

  /* ---- 补充事项 ---- */
  if(cls.extra){
    var eh=cls.extra, he=eh[0];
    var eT=xlFindCol(he,['事项标题','标题','事项']);
    var eD=xlFindCol(he,['说明','描述']);
    var eDt=xlFindCol(he,['提出日期','日期']);
    var eDue=xlFindCol(he,['约定完成日期','约定日期','截止日期']);
    var eOwn=xlFindCol(he,['责任人','负责人']);
    var eSt=xlFindCol(he,['状态']);
    for(var k=1;k<eh.length;k++){
      if(xlRowBlank(eh[k])) continue;
      var et=xlStr(eh[k],eT);
      if(!et){ E('补充事项 第 '+(k+1)+' 行：事项标题为空'); continue; }
      var st=xlStr(eh[k],eSt)||'待处理';
      if(EX_FLOW.indexOf(st)<0){ E('补充事项 第 '+(k+1)+' 行：状态「'+st+'」不合法（应为 '+'待处理 / 处理中 / 已完成）'); continue; }
      var dt=planFixDate(normDate(xlCell(eh[k],eDt))), du=planFixDate(normDate(xlCell(eh[k],eDue)));
      if(eDt>=0 && xlStr(eh[k],eDt) && !dt) E('补充事项 第 '+(k+1)+' 行：提出日期无法识别');
      if(eDue>=0 && xlStr(eh[k],eDue) && !du) E('补充事项 第 '+(k+1)+' 行：约定完成日期无法识别');
      res.extras.push({ title:et, desc:xlStr(eh[k],eD), date:dt||'', due:du||'',
                        owner:xlStr(eh[k],eOwn)||'待指派', st:st });
    }
  }

  /* ---- 统计 ---- */
  var byPhase={};
  res.tasks.forEach(function(t){ byPhase[t.pid]=(byPhase[t.pid]||0)+1; });
  res.stats={ phaseCount:res.phases.length, taskCount:res.tasks.length, extraCount:res.extras.length,
              byPhase:byPhase, order:order, hasPhaseSheet:!!cls.phase, hasExtraSheet:!!cls.extra };
  return res;
}
